<!doctype html>
<!-- Plak: Now Playing prototype. HTML mockup at 393x852; fonts, materials, controls and scrolling approximate the native ones.
     States by hash: #loading (buffering), #empty (nothing up next), #error (playback failed), #offline (downloads only). ?theme=light for the light appearance. -->
<html lang="en" data-platform="ios" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plak Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<script>if (new URLSearchParams(location.search).get('theme') === 'light') document.documentElement.dataset.theme = 'light';</script>
<style>
  /* device frame (assets/phone-frame.html) */
  :root { --w: 393px; --h: 852px; --safe-top: 59px; --safe-bottom: 34px; --chrome: #000; }
  [data-theme="dark"] { --chrome: #fff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; }
  body { position: relative; font-family: var(--font); -webkit-font-smoothing: antialiased; background: var(--ground); color: var(--ink); }
  .statusbar { position: absolute; inset: 0 0 auto 0; height: var(--safe-top); z-index: 50; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 10px; font-weight: 600; font-size: 16px; color: var(--chrome); pointer-events: none; }
  .statusbar svg { height: 12px; fill: var(--chrome); }
  .home-indicator { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 50; width: 134px; height: 5px; border-radius: 3px; background: var(--chrome); opacity: .9; pointer-events: none; }
  #screen { position: absolute; inset: 0; overflow: hidden; }
</style>
<style>
  /* PRODUCT TOKENS: dealt direction photo-editorial, dark-first. One place for colour, type, radii, spacing, motion. */
  @property --tint { syntax: '<color>'; inherits: true; initial-value: #263a3d; }
  :root {
    --font: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, sans-serif;
    --ground: #0A0A0A; --raised: #1A1A1A; --ink: #FFFFFF; --ink-2: #B3B3B3; --line: #2A2A2A;
    --accent: #D93B30; --on-accent: #FFFFFF; --positive: #3DB87A; --negative: #F0605A;
    --wash-mix: 46%; --wash-base: #000; --chip: rgb(255 255 255 / .12); --card: rgb(255 255 255 / .08);
    --t-title: 700 28px/1.12 var(--font); --t-section: 600 20px/1.2 var(--font); --t-body: 400 16px/1.35 var(--font);
    --t-body-strong: 600 16px/1.3 var(--font); --t-meta: 400 14px/1.3 var(--font); --t-tiny: 400 12px/1.2 var(--font);
    --r-art: 14px; --r-card: 12px; --r-thumb: 6px; --r-sheet: 16px;
    --m: 28px; --gap: 8px;
  }
  [data-theme="light"] {
    --ground: #FFFFFF; --raised: #F7F7F7; --ink: #1A1A1A; --ink-2: #5F5F5F; --line: #EBEBEB;
    --positive: #1F7A4C; --negative: #D93B30; --wash-mix: 30%; --wash-base: #fff; --chip: rgb(0 0 0 / .08); --card: rgb(0 0 0 / .05);
  }
</style>
<style>
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: transform .12s cubic-bezier(.22,1,.36,1); }
  button:active:not([aria-disabled="true"]) { transform: scale(.97); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
  h1, h2, h3, p, ol, ul { margin: 0; padding: 0; }
  li { list-style: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* never-grey image slot */
  .slot { position: relative; overflow: hidden; background: var(--c, #263a3d); }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .4s ease-out; }
  .slot img.in { opacity: 1; }

  /* ---------- base: the playlist Now Playing came from ---------- */
  .base { position: absolute; inset: 0; background: var(--ground); }
  .base-scroll { position: absolute; inset: 0; overflow-y: auto; padding: calc(var(--safe-top) + 8px) 20px calc(var(--safe-bottom) + 96px); scrollbar-width: none; }
  .wordmark { font: var(--t-title); letter-spacing: -0.02em; padding: 4px 0 20px; }
  .pl-head { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .pl-cover { width: 96px; height: 96px; border-radius: var(--r-card); flex: none; }
  .pl-head h2 { font: var(--t-section); }
  .pl-head p { font: var(--t-meta); color: var(--ink-2); margin-top: 4px; }
  .pl-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; text-align: left; border-radius: 10px; }
  .pl-row .th { width: 44px; height: 44px; border-radius: var(--r-thumb); flex: none; }
  .pl-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pl-row .t1 { font: var(--t-body-strong); }
  .pl-row .t2 { font: var(--t-meta); color: var(--ink-2); }
  .pl-row .du { font: var(--t-meta); color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .pl-row .now { color: var(--accent); font-size: 18px; }
  .mini { position: absolute; left: 8px; right: 8px; bottom: calc(var(--safe-bottom) + 6px); height: 64px; border-radius: var(--r-card); display: flex; align-items: center; padding: 0 4px 0 8px; gap: 4px; background: color-mix(in oklab, var(--tint) 40%, var(--raised)); }
  .mini-main { flex: 1; min-width: 0; height: 56px; display: flex; align-items: center; gap: 12px; text-align: left; }
  .mini-main .th { width: 46px; height: 46px; border-radius: var(--r-thumb); flex: none; }
  .mini-main .tx { min-width: 0; display: flex; flex-direction: column; }
  .mini-main .t1 { font: var(--t-body-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-main .t2 { font: var(--t-meta); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; font-size: 26px; flex: none; }

  /* ---------- Now Playing ---------- */
  .np { position: absolute; inset: 0; display: flex; flex-direction: column; padding: var(--safe-top) var(--m) var(--safe-bottom);
        background: linear-gradient(180deg, color-mix(in oklab, var(--tint) var(--wash-mix), var(--wash-base)) 0%, color-mix(in oklab, var(--tint) calc(var(--wash-mix) * .5), var(--ground)) 58%, var(--ground) 100%);
        transition: --tint .6s ease-out; }
  .np-top { height: 52px; display: flex; align-items: center; justify-content: space-between; margin: 0 -10px; flex: none; }
  .from { flex: 1; min-width: 0; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 10px; }
  .from .l1 { font: var(--t-tiny); font-size: 13px; color: var(--ink-2); }
  .from .l2 { font: var(--t-body-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .art-wrap { flex: 1 1 auto; min-height: 0; container-type: size; display: grid; place-items: center; margin: 10px 0 22px; }
  .art { position: relative; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
  .cov { position: absolute; inset: 0; border-radius: var(--r-art); transform-origin: 0 0; box-shadow: 0 1px 0 rgb(0 0 0 / .2); }
  .lyrics { position: absolute; inset: 0; z-index: 5; border-radius: var(--r-art); background: var(--raised); overflow-y: auto; padding: 22px 22px 28px; scrollbar-width: none; }
  .lyrics p { font: 600 22px/1.35 var(--font); color: var(--ink); }
  .lyrics p + p { margin-top: 10px; }
  .lyrics .none { font: var(--t-body); color: var(--ink-2); }
  .tt { display: flex; align-items: flex-start; gap: 12px; flex: none; }
  .tt-text { flex: 1; min-width: 0; }
  .tt h1 { font: var(--t-title); letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .artist { font: var(--t-body); color: var(--ink-2); margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font: var(--t-tiny); display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px; background: var(--chip); color: var(--ink); }
  .like { font-size: 28px; margin: -4px -8px 0 0; }
  .like[aria-pressed="true"] { color: var(--accent); }
  .scrub { margin-top: 16px; height: 28px; display: flex; align-items: center; touch-action: none; cursor: pointer; flex: none; --p: 0; }
  .rail { position: relative; width: 100%; height: 4px; border-radius: 2px; background: color-mix(in oklab, var(--ink) 24%, transparent); transition: height .15s ease-out; }
  .fill { position: absolute; inset: 0; border-radius: 2px; background: var(--ink); transform-origin: 0 50%; transform: scaleX(var(--p)); }
  .knob { position: absolute; top: 50%; left: calc(var(--p) * 100%); width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--ink); transition: transform .15s ease-out; }
  .scrub.drag .rail { height: 6px; }
  .scrub.drag .knob { transform: scale(1.4); }
  .times { display: flex; justify-content: space-between; font: var(--t-meta); color: var(--ink-2); margin-top: 2px; flex: none; }
  .transport { display: flex; align-items: center; justify-content: space-between; height: 80px; margin-top: 6px; padding-bottom: 0; flex: none; }
  .tb { position: relative; width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; font-size: 36px; }
  .tb.side { width: 64px; height: 64px; font-size: 24px; color: var(--ink-2); display: flex; flex-direction: column; justify-content: center; gap: 3px; border-radius: 14px; }
  .tb.side .lbl { font: var(--t-tiny); white-space: nowrap; }
  .tb.side[aria-pressed="true"] { color: var(--ink); background: var(--chip); }
  .tb[aria-disabled="true"] { opacity: .35; cursor: default; }
  .play { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 34px; display: grid; place-items: center; }
  .spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid color-mix(in oklab, var(--on-accent) 35%, transparent); border-top-color: var(--on-accent); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .upnext { margin-top: auto; display: flex; align-items: center; gap: 8px; min-height: 68px; border-radius: var(--r-card); background: var(--card); padding: 0 8px 0 0; flex: none; }
  .un-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 4px 10px 10px; text-align: left; border-radius: var(--r-card); }
  .un-thumb { width: 48px; height: 48px; border-radius: var(--r-thumb); flex: none; }
  .un-icon { width: 48px; height: 48px; flex: none; display: grid; place-items: center; font-size: 28px; color: var(--negative); }
  .un-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .un-label { font: var(--t-tiny); font-size: 13px; color: var(--ink-2); }
  .un-title { font: var(--t-body-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .un-sub { font: var(--t-meta); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .un-count { display: flex; flex-direction: column; align-items: flex-end; font: var(--t-meta); gap: 2px; padding-right: 4px; }
  .un-count .n { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .un-count .n > i { font-size: 18px; }
  .un-min { color: var(--ink-2); }
  .un-act { min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--ground); font: var(--t-body-strong); font-size: 15px; white-space: nowrap; flex: none; }
  .util { display: flex; justify-content: space-between; margin: 6px -10px 0; flex: none; }
  .ub { min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 8px; font: var(--t-meta); color: var(--ink-2); border-radius: 10px; }
  .ub i { font-size: 22px; }
  .ub[aria-pressed="true"] { color: var(--ink); background: var(--chip); }

  /* ---------- menus ---------- */
  .catch { position: absolute; inset: 0; z-index: 30; }
  .menu { position: absolute; z-index: 31; min-width: 230px; padding: 6px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); box-shadow: 0 12px 32px rgb(0 0 0 / .35);
          transform-origin: var(--ox, 100%) var(--oy, 0%); transition: opacity .16s ease-out, transform .16s ease-out, display .16s allow-discrete; }
  @starting-style { .menu { opacity: 0; transform: scale(.94); } }
  .mi { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 10px; font: var(--t-body); text-align: left; }
  .mi i { font-size: 22px; width: 22px; }
  .mi .ck { margin-left: auto; color: var(--ink); }
  .mi:active { background: var(--chip); }
  .menu .mh { font: var(--t-meta); color: var(--ink-2); padding: 8px 12px 4px; }

  /* ---------- queue sheet ---------- */
  .scrim { position: absolute; inset: 0; z-index: 20; background: rgb(0 0 0 / .5); opacity: 0; transition: opacity .25s ease-out; }
  .scrim.open { opacity: 1; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 80%; z-index: 21; background: var(--raised); border-radius: var(--r-sheet) var(--r-sheet) 0 0; display: flex; flex-direction: column;
           transform: translateY(102%); transition: transform var(--sheet-ms, 420ms) var(--sheet-ease, cubic-bezier(.2,.8,.2,1)); }
  .sheet.open { transform: translateY(0); }
  .grab { height: 24px; display: grid; place-items: center; touch-action: none; cursor: grab; flex: none; }
  .grab span { width: 36px; height: 5px; border-radius: 3px; background: color-mix(in oklab, var(--ink) 30%, transparent); }
  .q-head { display: flex; align-items: center; padding: 0 12px 0 20px; gap: 4px; flex: none; }
  .q-head h2 { font: var(--t-section); flex: 1; }
  .q-head h2:focus { outline: none; }
  .tbtn { min-height: 44px; padding: 0 12px; font: var(--t-body-strong); border-radius: 10px; }
  .tbtn.pri { color: var(--ink); }
  .q-from { font: var(--t-meta); color: var(--ink-2); padding: 0 20px 8px; flex: none; }
  .q-body { flex: 1; overflow-y: auto; padding: 0 20px calc(var(--safe-bottom) + 16px); scrollbar-width: none; overscroll-behavior: contain; }
  .q-sec { display: flex; justify-content: space-between; align-items: baseline; font: var(--t-body-strong); padding: 16px 0 6px; }
  .q-sec span { font: var(--t-meta); color: var(--ink-2); }
  .q-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; text-align: left; border-radius: 10px; }
  .q-row .th { width: 44px; height: 44px; border-radius: var(--r-thumb); flex: none; }
  .q-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .q-row .t1 { font: var(--t-body-strong); }
  .q-row .t2 { font: var(--t-meta); color: var(--ink-2); }
  .q-row .du { font: var(--t-meta); color: var(--ink-2); }
  .q-row.na .th, .q-row.na .t1 { opacity: .45; }
  .q-li.edit .du { display: none; }
  .q-li.edit { display: flex; align-items: center; gap: 4px; }
  .q-li.edit .q-row { flex: 1; min-width: 0; cursor: default; }
  .q-li.edit .q-row:active { transform: none; }
  .ib.sm { font-size: 22px; color: var(--ink-2); }
  .ib.rm { color: var(--negative); }
  .ib[disabled] { opacity: .3; cursor: default; }
  .q-removed { display: flex; align-items: center; justify-content: space-between; min-height: 60px; font: var(--t-meta); color: var(--ink-2); border-bottom: 1px solid var(--line); }
  .q-removed button { font: var(--t-body-strong); color: var(--ink); min-height: 44px; padding: 0 12px; border-radius: 10px; }
  .q-empty { padding: 24px 0; font: var(--t-body); color: var(--ink-2); display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }

  html[data-state="loading"] .tt h1, html[data-state="loading"] .artist { opacity: .95; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } .spin { animation: none; border-color: var(--on-accent); border-top-color: transparent; } }
  ::view-transition-old(cover), ::view-transition-new(cover) { height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="statusbar">
    <span id="clock">10:08</span>
    <svg viewBox="0 0 66 12" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/>
      <rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/>
      <path d="M31 2.2a9 9 0 0 1 7 3l-1.5 1.5a7 7 0 0 0-11 0L24 5.2a9 9 0 0 1 7-3zm0 4a5 5 0 0 1 4 2l-4 4-4-4a5 5 0 0 1 4-2z"/>
      <rect x="44" y="0.5" width="19" height="11" rx="3" fill="none" stroke="currentColor" style="stroke: var(--chrome)" opacity=".5"/>
      <rect x="45.5" y="2" width="14" height="8" rx="1.8"/><rect x="64" y="4" width="1.6" height="4" rx=".8" opacity=".5"/>
    </svg>
  </div>

  <main id="screen">
    <!-- the playlist behind the Now Playing sheet; reached with the close button -->
    <section class="base" id="base" aria-label="Late Drive playlist" inert>
      <div class="base-scroll" id="baseScroll">
        <h2 class="wordmark">Plak</h2>
        <div class="pl-head">
          <div class="pl-cover slot" id="plCover"></div>
          <div><h2>Late Drive</h2><p id="plMeta" class="tnum"></p></div>
        </div>
        <ol id="plList"></ol>
      </div>
      <div class="mini" id="mini">
        <button class="mini-main" id="miniOpen" aria-label="Open Now Playing">
          <span class="th slot" id="miniThumb"></span>
          <span class="tx"><span class="t1" id="miniTitle"></span><span class="t2" id="miniArtist"></span></span>
        </button>
        <button class="ib" id="miniPlay"><i class="ph-fill ph-pause"></i></button>
        <button class="ib" id="miniNext" aria-label="Next song"><i class="ph-fill ph-skip-forward"></i></button>
      </div>
    </section>

    <section class="np" id="np" role="dialog" aria-label="Now Playing">
      <header class="np-top">
        <button class="ib" id="closeNp" aria-label="Close Now Playing"><i class="ph ph-caret-down"></i></button>
        <button class="from" id="fromBtn" aria-label="Go to playlist Late Drive">
          <span class="l1" id="fromL1">Playing from playlist</span><span class="l2">Late Drive</span>
        </button>
        <button class="ib" id="moreBtn" aria-label="More options" aria-haspopup="menu" aria-expanded="false"><i class="ph ph-dots-three"></i></button>
      </header>

      <div class="art-wrap"><div class="art" id="art">
        <div class="lyrics" id="lyrics" hidden tabindex="0" aria-label="Lyrics"></div>
      </div></div>

      <div class="tt" id="meta">
        <div class="tt-text">
          <h1 id="npTitle"></h1>
          <p class="artist"><span id="npArtist"></span><span class="badge" id="dlBadge" hidden><i class="ph ph-download-simple"></i>Downloaded</span></p>
        </div>
        <button class="ib like" id="likeBtn" aria-pressed="false" aria-label="Like"><i class="ph ph-heart"></i></button>
      </div>

      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Song position" aria-valuemin="0">
        <div class="rail" id="rail"><div class="fill"></div><div class="knob"></div></div>
      </div>
      <div class="times tnum"><span id="tEl"></span><span id="tRem"></span></div>

      <div class="transport">
        <button class="tb side" id="shufBtn" aria-pressed="false"><i class="ph ph-shuffle"></i><span class="lbl" id="shufLbl">Shuffle</span></button>
        <button class="tb" id="prevBtn" aria-label="Previous song"><i class="ph-fill ph-skip-back"></i></button>
        <button class="play" id="playBtn"><i class="ph-fill ph-pause"></i></button>
        <button class="tb" id="nextBtn" aria-label="Next song"><i class="ph-fill ph-skip-forward"></i></button>
        <button class="tb side" id="repBtn" aria-pressed="false"><i class="ph ph-repeat"></i><span class="lbl" id="repLbl">Repeat</span></button>
      </div>

      <div class="upnext" id="upNext">
        <button class="un-main" id="unMain" aria-haspopup="dialog">
          <span class="un-thumb slot" id="unThumb"></span>
          <span class="un-icon" id="unIcon" hidden><i class="ph ph-warning-circle"></i></span>
          <span class="un-text"><span class="un-label" id="unLabel">Up next</span><span class="un-title" id="unTitle"></span><span class="un-sub" id="unSub"></span></span>
          <span class="un-count" id="unCountBox"><span class="n"><i class="ph ph-queue"></i><span id="unCount" class="tnum"></span><span id="unWord">songs</span></span><span class="un-min tnum" id="unMin"></span></span>
        </button>
        <button class="un-act" id="unAct" hidden></button>
      </div>

      <div class="util">
        <button class="ub" id="lyricsBtn" aria-pressed="false"><i class="ph ph-quotes"></i><span>Lyrics</span></button>
        <button class="ub" id="devBtn" aria-haspopup="menu" aria-expanded="false"><i class="ph ph-device-mobile" id="devIcon"></i><span id="devName">iPhone</span></button>
      </div>
    </section>

    <div class="catch" id="catch" hidden></div>
    <div class="menu" id="moreMenu" role="menu" aria-label="More options" hidden style="top: 108px; right: 16px; --ox: 100%; --oy: 0%">

      act.textContent = 'Repeat playlist'; act.dataset.do = 'repeat';
      $('#unMain').setAttribute('aria-label', 'Nothing up next. Open queue');
    } else {
      const n = up[0];
      $('#unLabel').textContent = S.state === 'offline' ? 'Up next, downloaded' : S.queue.filter(playable).length ? 'Up next' : 'Up next, from the start';
      $('#unTitle').textContent = T[n].title; $('#unSub').textContent = T[n].artist;
      if (t.dataset.i !== String(n)) {
        slot(t, n); t.dataset.i = n;
        if (swap && !MK.reduced()) t.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: 160, easing: MK.out, fill: 'backwards' });
      }
      MK.roll($("#unCount"), String(up.length)); $("#unWord").textContent = up.length === 1 ? "song" : "songs"; $('#unMin').textContent = minutes(sum(up));
      $('#unMain').setAttribute('aria-label', `Up next: ${T[n].title} by ${T[n].artist}. Queue, ${songs(up.length)}, ${minutes(sum(up))}. Open queue`);
    }
  }
  function renderHeader() {
    $('#fromL1').textContent = S.state === 'offline' ? 'Offline, downloads only' : 'Playing from playlist';
    const d = DEVICES.find((x) => x.name === S.dev);
    $('#devName').textContent = d.name; $('#devIcon').className = `ph ${d.icon}`;
    $('#devBtn').setAttribute('aria-label', `Playing on ${d.name}. Change output`);
    $('#lyricsBtn').setAttribute('aria-pressed', S.lyrics); $('#lyrics').hidden = !S.lyrics;
  }
  function renderBase() {
    $('#plMeta').textContent = `Playlist, ${songs(T.length)}, ${minutes(sum(T.map((_, i) => i)))}`;
    if (!$('#plCover').firstChild) slot($('#plCover'), 1);
    $('#plList').innerHTML = T.map((tr, i) => `<li><button class="pl-row" data-i="${i}" ${i === S.cur ? 'aria-current="true"' : ''} aria-label="${tr.title} by ${tr.artist}, ${fmt(tr.dur)}${i === S.cur ? ', now playing' : ''}">
      <span class="th slot" data-slot="${i}"></span><span class="tx"><span class="t1">${tr.title}</span><span class="t2">${tr.artist}</span></span>
      <span class="du tnum">${i === S.cur ? '<i class="ph-fill ph-speaker-simple-high now"></i>' : ''}${fmt(tr.dur)}</span></button></li>`).join('');
    $('#plList').querySelectorAll('[data-slot]').forEach((el) => slot(el, +el.dataset.slot));
    const mt = $('#miniThumb'); if (mt.dataset.i !== String(S.cur)) { slot(mt, S.cur); mt.dataset.i = S.cur; }
    $('#miniTitle').textContent = cur().title; $('#miniArtist').textContent = cur().artist;
    $('#mini').style.setProperty('--tint', cur().tint);
  }
  function rowHTML(i, k) {
    const tr = T[i], ok = playable(i), n = S.queue.filter(playable).length;
    const row = `<button class="q-row${ok ? "" : " na"}" data-play="${i}" ${ok && !S.edit ? '' : 'aria-disabled="true"'} ${S.edit ? 'tabindex="-1"' : ''}
      aria-label="${tr.title} by ${tr.artist}, ${ok ? fmt(tr.dur) + (S.edit ? '' : '. Play now') : 'not downloaded'}">
      <span class="th slot" data-slot="${i}"></span><span class="tx"><span class="t1">${tr.title}</span><span class="t2">${tr.artist}</span></span>
      <span class="du tnum">${ok ? fmt(tr.dur) : 'Not downloaded'}</span></button>`;
    if (!S.edit) return `<li class="q-li">${row}</li>`;
    return `<li class="q-li edit"><button class="ib sm rm" data-rm="${i}" aria-label="Remove ${tr.title} from queue"><i class="ph-fill ph-minus-circle"></i></button>${row}
      <button class="ib sm" data-up="${i}" aria-label="Move ${tr.title} up" ${k === 0 ? 'disabled' : ''}><i class="ph ph-caret-up"></i></button>
      <button class="ib sm" data-down="${i}" aria-label="Move ${tr.title} down" ${k === S.queue.length - 1 ? 'disabled' : ''}><i class="ph ph-caret-down"></i></button></li>`;
  }
  function renderQueue() {
    if (!S.qOpen) return;
    const up = upcoming(), tr = cur();
    $('#editBtn').setAttribute('aria-pressed', S.edit); $('#editBtn').textContent = S.edit ? 'Edit done' : 'Edit';
    $('#qFrom').textContent = S.state === 'offline' ? 'Offline: downloaded songs play, others wait' : 'Playing from Late Drive';
    let list = S.queue.map((i, k) => rowHTML(i, k));
    if (S.pending) list.splice(S.pending.idx, 0, `<li class="q-removed"><span>Removed ${T[S.pending.i].title}</span><button data-undo>Undo</button></li>`);
    const empty = !S.queue.length && !S.pending;
    $('#qBody').innerHTML = `<p class="q-sec">Now playing</p>
      <div class="q-row" role="group" aria-label="Now playing: ${tr.title} by ${tr.artist}"><span class="th slot" data-slot="${S.cur}"></span>
        <span class="tx"><span class="t1">${tr.title}</span><span class="t2">${tr.artist}</span></span>
        <span class="du"><i class="ph-fill ${S.playing ? 'ph-speaker-simple-high' : 'ph-pause'}" style="color:var(--accent);font-size:18px"></i></span></div>
      <p class="q-sec">Up next <span class="tnum">${up.length ? songs(up.length) + ', ' + minutes(sum(up)) : songs(0)}</span></p>
      ${empty ? `<div class="q-empty"><span>${S.repeat === 'all' ? 'The playlist starts again after this song.' : 'Nothing up next. Playback stops after this song.'}</span>
        ${S.repeat === 'all' ? '' : '<button class="un-act" data-do="repeat">Repeat playlist</button>'}</div>` : `<ol>${list.join('')}</ol>`}`;
    $('#qBody').querySelectorAll('[data-slot]').forEach((el) => slot(el, +el.dataset.slot));
  }
  function renderAll() { renderMeta(); renderTime(); renderPlay(); renderModes(); renderUpNext(false); renderHeader(); renderBase(); renderQueue(); }

  /* ---------- the signature: skip moves real covers ---------- */
  // Grab an element where it is on screen right now, so an interrupted move continues from there.
  function grab(el) {
    const cs = getComputedStyle(el), s = { translate: cs.translate === 'none' ? '0px 0px' : cs.translate, scale: cs.scale === 'none' ? '1' : cs.scale, opacity: cs.opacity };
    el.getAnimations().forEach((a) => a.cancel()); return s;
  }
  function swapCover(dir) {
    const art = $('#art'), red = MK.reduced(), sp = MK.ease.spatial;
    const olds = [...art.querySelectorAll('.cov')];
    const neu = slot(Object.assign(document.createElement('div'), { className: 'cov slot' }), S.cur, `Cover of ${cur().title}`);
    art.insertBefore(neu, $('#lyrics'));
    const th = $('#unThumb'), tr = th.hidden ? null : th.getBoundingClientRect(), ar = art.getBoundingClientRect();
    const toThumb = tr && tr.width ? { translate: `${tr.left - ar.left}px ${tr.top - ar.top}px`, scale: `${tr.width / ar.width}` } : { translate: '0px 40%', scale: '.6' };
    olds.forEach((o) => {
      const s = grab(o); o.style.zIndex = dir < 0 ? 3 : 1;
      let kf, opt = { duration: 200, easing: MK.out, fill: 'forwards' };
      if (red || !dir) kf = [{ opacity: s.opacity }, { opacity: 0 }];
      else if (dir > 0) kf = [s, { translate: '-14% 6%', scale: '.82', opacity: 0 }];
      else { kf = [s, { ...toThumb, opacity: 1 }]; opt = { duration: sp.ms, easing: sp.easing, fill: 'forwards' }; } // back into the up-next slot
      o.animate(kf, opt).finished.then(() => o.remove(), () => {});
    });
    neu.style.zIndex = 2;
    if (red || !dir) neu.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: MK.out });
    else if (dir > 0) neu.animate([toThumb, { translate: '0px 0px', scale: '1' }], { duration: sp.ms, easing: sp.easing }); // the up-next cover grows into place
    else neu.animate([{ opacity: 0, scale: '.94' }, { opacity: 1, scale: '1' }], { duration: 240, easing: MK.out });
  }
  function swapMeta() {
    const box = $('#meta');
    if (MK.reduced()) { renderMeta(); box.animate([{ opacity: .3 }, { opacity: 1 }], { duration: 150, easing: MK.out }); return; }
    box.getAnimations().forEach((a) => a.cancel());
    const out = box.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 80, easing: MK.out, fill: 'forwards' });
    out.finished.then(() => { renderMeta(); out.cancel(); box.animate([{ opacity: 0, translate: '0 6px' }, { opacity: 1, translate: '0 0' }], { duration: 170, easing: MK.out }); }, () => renderMeta());
  }
  function changed(dir) {
    if (S.npOpen) { swapCover(dir); swapMeta(); } else renderMeta();
    S.t = 0; renderTime(); renderPlay(); renderModes(); renderUpNext(true); renderBase(); renderQueue();
    live(`Now playing ${cur().title} by ${cur().artist}`);
  }

  /* ---------- playback ---------- */
  function clearState() { if (location.hash) { history.replaceState(null, '', location.pathname + location.search); sync(); } }
  function next() {
    if (!upcoming().length) return;
    if (S.state === 'error' || S.state === 'loading') clearState();
    if (!S.queue.filter(playable).length && S.repeat === 'all') { S.queue = refillList(); S.hist = []; }
    const n = S.queue.find(playable); S.queue.splice(S.queue.indexOf(n), 1);
    S.hist.push(S.cur); S.cur = n; S.playing = true; commitPending(); changed(1);
  }
  function prev() {
    const back = S.hist.filter(playable);
    if (S.t > 3 || !back.length) { S.t = 0; renderTime(); live(`Restarted ${cur().title}`); return; }
    if (S.state === 'error' || S.state === 'loading') clearState();
    const p = back[back.length - 1]; S.hist.splice(S.hist.lastIndexOf(p), 1);
    S.queue.unshift(S.cur); S.cur = p; S.playing = true; commitPending(); changed(-1);
  }
  function jump(i) {
    const k = S.queue.indexOf(i); if (k < 0 || !playable(i)) return;
    S.hist.push(S.cur, ...S.queue.splice(0, k)); S.queue.shift(); S.cur = i; S.playing = true; commitPending(); changed(1);
  }
  function playFromList(i) {
    if (i === S.cur) { openNp(); return; }
    S.hist = T.map((_, k) => k).filter((k) => k < i); S.queue = T.map((_, k) => k).filter((k) => k > i);
    if (S.shuffle) S.queue = shuffled(S.queue);
    S.cur = i; S.playing = true; changed(0);
  }
  function trackEnd() {
    if (S.repeat === 'one') { S.t = 0; return; }
    if (upcoming().length) { next(); return; }
    S.playing = false; S.t = cur().dur; renderPlay(); renderQueue();
  }
  let dragging = false, last = performance.now();
  setInterval(() => { // real time: the playing song's position is the only thing that moves on its own
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    if (!S.playing || busy() || dragging) return;
    S.t += dt; if (S.t >= cur().dur) trackEnd(); renderTime();
  }, 250);

  function togglePlay() {
    if (S.state === 'error') { clearState(); S.playing = true; renderPlay(); return; }
    S.playing = !S.playing; renderPlay(); renderQueue(); live(S.playing ? 'Playing' : 'Paused');
  }
  function commitPending() { S.pending = null; }

  /* ---------- controls ---------- */
  $('#playBtn').onclick = togglePlay; $('#miniPlay').onclick = togglePlay;
  $('#nextBtn').onclick = () => next(); $('#miniNext').onclick = () => next(); $('#prevBtn').onclick = prev;
  $('#shufBtn').onclick = () => {
    S.shuffle = !S.shuffle;
    S.queue = S.shuffle ? shuffled(S.queue) : S.queue.slice().sort((a, b) => a - b);
    renderModes(); renderUpNext(true); renderQueue(); live(S.shuffle ? 'Shuffle on. Up next reordered' : 'Shuffle off. Playlist order');
  };
  $('#repBtn').onclick = () => {
    S.repeat = { off: 'all', all: 'one', one: 'off' }[S.repeat];
    renderModes(); renderUpNext(true); renderQueue(); live({ off: 'Repeat off', all: 'Repeat all', one: 'Repeat this song' }[S.repeat]);
  };
  $('#likeBtn').onclick = () => {
    const tr = cur(); S.liked.has(S.cur) ? S.liked.delete(S.cur) : S.liked.add(S.cur);
    renderMeta(); MK.haptic('light'); live(S.liked.has(S.cur) ? `${tr.title} added to Liked Songs` : `${tr.title} removed from Liked Songs`);
    if (S.liked.has(S.cur) && !MK.reduced()) $('#likeBtn i').animate([{ scale: '.8' }, { scale: '1' }], { duration: MK.ease.fast.ms, easing: MK.ease.fast.easing });
  };
  $('#lyricsBtn').onclick = () => { S.lyrics = !S.lyrics; renderHeader(); live(S.lyrics ? 'Lyrics shown' : 'Lyrics hidden'); };
  $('#unMain').onclick = openQueue;
  $('#unAct').onclick = (e) => act(e.currentTarget.dataset.do);
  function act(what) {
    if (what === 'retry') { clearState(); S.playing = true; renderPlay(); $('#playBtn').focus({ preventScroll: true }); live(`Playing ${cur().title}`); }
    if (what === 'repeat') { S.repeat = 'all'; renderModes(); renderUpNext(true); renderQueue(); if (!S.qOpen) $('#unMain').focus({ preventScroll: true }); live('Repeat all. The playlist starts again after this song'); }
  }

  /* scrubber: drag, tap, or arrow keys */
  const scrub = $('#scrub');
  const seekTo = (e) => { const r = $('#rail').getBoundingClientRect(); S.t = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * cur().dur; renderTime(); };
  scrub.addEventListener('pointerdown', (e) => { dragging = true; try { scrub.setPointerCapture(e.pointerId); } catch {} scrub.classList.add('drag'); seekTo(e); });
  scrub.addEventListener('pointermove', (e) => { if (dragging) seekTo(e); });
  const endSeek = (e) => { if (!dragging) return; dragging = false; scrub.classList.remove('drag'); seekTo(e); MK.haptic('selection'); live(`Moved to ${spoken(S.t)}`); };
  scrub.addEventListener('pointerup', endSeek); scrub.addEventListener('pointercancel', endSeek);
  scrub.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
    if (d) { S.t = Math.min(cur().dur - 1, Math.max(0, S.t + d)); renderTime(); e.preventDefault(); }
    if (e.key === 'Home') { S.t = 0; renderTime(); e.preventDefault(); }
  });

  /* menus */
  let openMenuEl = null, menuBtn = null;
  function openMenu(menu, btn) {
    closeMenu(); openMenuEl = menu; menuBtn = btn; menu.hidden = false; $('#catch').hidden = false; btn.setAttribute('aria-expanded', 'true');
    menu.querySelector('.mi').focus({ preventScroll: true });
  }
  function closeMenu() {
    if (!openMenuEl) return; openMenuEl.hidden = true; $('#catch').hidden = true; menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.focus({ preventScroll: true }); openMenuEl = menuBtn = null;
  }
  $('#catch').onclick = closeMenu;
  $('#moreBtn').onclick = (e) => openMenu($('#moreMenu'), e.currentTarget);
  $('#devBtn').onclick = (e) => {
    $('#devList').innerHTML = DEVICES.map((d) => `<button class="mi" role="menuitemradio" aria-checked="${d.name === S.dev}" data-dev="${d.name}"><i class="ph ${d.icon}"></i><span>${d.name}</span>${d.name === S.dev ? '<i class="ph ph-check ck"></i>' : ''}</button>`).join('');
    openMenu($('#devMenu'), e.currentTarget);
  };
  $('#devList').onclick = (e) => { const b = e.target.closest('[data-dev]'); if (!b) return; S.dev = b.dataset.dev; renderHeader(); closeMenu(); live(`Playing on ${S.dev}`); };
  $('#dlItem').onclick = () => { const tr = cur(); tr.dl = !tr.dl; renderMeta(); renderUpNext(false); closeMenu(); live(tr.dl ? `${tr.title} downloaded` : `Download of ${tr.title} removed`); };
  $('#plItem').onclick = () => { closeMenu(); closeNp(); };

  /* Now Playing <-> mini player: the cover is the shared element */
  function setOpen(open) { S.npOpen = open; $('#np').hidden = !open; $('#base').inert = open; }
  function closeNp() {
    if (!S.npOpen) return;
    const big = [...$('#art').querySelectorAll('.cov')].pop(), mt = $('#miniThumb');
    if (big) big.style.viewTransitionName = 'cover';
    MK.morph(() => { if (big) big.style.viewTransitionName = ''; mt.style.viewTransitionName = 'cover'; setOpen(false); })
      .then(() => { mt.style.viewTransitionName = ''; $('#miniOpen').focus({ preventScroll: true }); });
  }
  function openNp() {
    if (S.npOpen) return;
    const mt = $('#miniThumb'); mt.style.viewTransitionName = 'cover';
    MK.morph(() => {
      mt.style.viewTransitionName = ''; setOpen(true); renderAll();
      if (!$('#art .cov')) swapCover(0);
      const big = [...$('#art').querySelectorAll('.cov')].pop(); big.getAnimations().forEach((a) => a.finish()); big.style.viewTransitionName = 'cover';
    }).then(() => { const big = [...$('#art').querySelectorAll('.cov')].pop(); if (big) big.style.viewTransitionName = ''; $('#closeNp').focus({ preventScroll: true }); });
  }
  $('#closeNp').onclick = closeNp; $('#fromBtn').onclick = closeNp; $('#miniOpen').onclick = openNp;
  $('#plList').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) playFromList(+b.dataset.i); };

  /* queue sheet */
  const sheet = $('#queue');
  sheet.style.setProperty('--sheet-ms', MK.ease.spatial.ms + 'ms'); sheet.style.setProperty('--sheet-ease', MK.ease.spatial.easing);
  function openQueue() {
    S.qOpen = true; S.edit = false; renderQueue();
    $('#scrim').hidden = false; sheet.hidden = false; $('#np').inert = true;
    requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('open'); $('#scrim').classList.add('open'); }));
    $('#qTitle').focus({ preventScroll: true });
  }
  function closeQueue() {
    if (!S.qOpen) return;
    S.qOpen = false; S.edit = false; commitPending(); $('#np').inert = false;
    sheet.classList.remove('open'); $('#scrim').classList.remove('open');
    setTimeout(() => { if (!S.qOpen) { sheet.hidden = true; $('#scrim').hidden = true; } }, 320);
    renderUpNext(false); renderModes(); $('#unMain').focus({ preventScroll: true });
  }
  $('#doneBtn').onclick = closeQueue; $('#scrim').onclick = closeQueue;
  $('#editBtn').onclick = () => { S.edit = !S.edit; commitPending(); renderQueue(); $('#editBtn').focus({ preventScroll: true }); };
  $('#qBody').onclick = (e) => {
    const t = e.target.closest('button'); if (!t) return;
    const focusRow = (sel) => { const el = $('#qBody').querySelector(sel); if (el) el.focus({ preventScroll: true }); };
    if (t.dataset.do) { act(t.dataset.do); return; }
    if (t.dataset.undo !== undefined && S.pending) {
      const { i, idx } = S.pending; S.queue.splice(idx, 0, i); S.pending = null;
      renderQueue(); renderUpNext(true); renderModes(); focusRow(S.edit ? `[data-rm="${i}"]` : `[data-play="${i}"]`); live(`${T[i].title} is back in the queue`); return;
    }
    if (t.dataset.rm) {
      const i = +t.dataset.rm, idx = S.queue.indexOf(i); S.queue.splice(idx, 1); S.pending = { i, idx };
      renderQueue(); renderUpNext(true); renderModes(); focusRow('[data-undo]'); live(`Removed ${T[i].title} from the queue. Undo available`); return;
    }
    if (t.dataset.up || t.dataset.down) {
      const i = +(t.dataset.up || t.dataset.down), k = S.queue.indexOf(i), j = k + (t.dataset.up ? -1 : 1);
      if (j < 0 || j >= S.queue.length) return;
      commitPending(); [S.queue[k], S.queue[j]] = [S.queue[j], S.queue[k]];
      renderQueue(); renderUpNext(true); focusRow(t.dataset.up ? `[data-up="${i}"]:not([disabled]), [data-down="${i}"]` : `[data-down="${i}"]:not([disabled]), [data-up="${i}"]`);
      live(`${T[i].title} moved to position ${j + 1}`); return;
    }
    if (t.dataset.play && !S.edit && t.getAttribute('aria-disabled') !== 'true') jump(+t.dataset.play);
  };
  // drag the grabber down to dismiss; Done, the scrim and Escape do the same
  let sy0 = 0;
  MK.drag($('#grab'), {
    axis: 'y',
    onStart: () => { sheet.style.transition = 'none'; sy0 = 0; },
    onMove: (_, dy) => { sy0 = dy; sheet.style.transform = `translateY(${dy < 0 ? dy * 0.25 : dy}px)`; },
    onEnd: ({ dy, vy }) => { sheet.style.transition = ''; sheet.style.transform = ''; if (dy + vy * 180 > 160) closeQueue(); },
  });

  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (openMenuEl) closeMenu(); else if (S.qOpen) closeQueue(); else if (S.npOpen) closeNp();
  });

  /* states by URL hash: #loading #empty #error #offline */
  const STATES = ['loading', 'empty', 'error', 'offline'];
  let savedQueue = null;
  function sync() {
    const s = location.hash.slice(1), st = STATES.includes(s) ? s : 'content';
    if (st === 'empty') { if (!savedQueue) savedQueue = S.queue.slice(); S.queue = []; S.repeat = 'off'; }
    else if (savedQueue) { S.queue = savedQueue; savedQueue = null; }
    S.state = st; document.documentElement.dataset.state = st; renderAll();
  }
  addEventListener('hashchange', sync);
  sync(); swapCover(0);

  // self-check: every figure shown for the queue is computed from the same list
  console.assert(sum([2, 3, 4, 5, 6, 7]) === 1338 && minutes(1338) === '22 min', 'queue total');
  console.assert(sum(T.map((_, i) => i)) === 1767, 'playlist total');
  </script>
</body>
</html>
