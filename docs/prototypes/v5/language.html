<!doctype html>
<html lang="en" data-platform="ios" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Söz, home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<script>
  // the dealt appearance is light; the other one only by ?theme=dark
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'dark' || q === 'light') document.documentElement.dataset.theme = q;
</script>
<style>
  /* phone frame (assets/phone-frame.html) */
  :root { --w: 393px; --h: 852px; --safe-top: 59px; --safe-bottom: 34px; --chrome: #000; }
  [data-theme="dark"] { --chrome: #fff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: clip; }
  body { position: relative; font-family: var(--font); -webkit-font-smoothing: antialiased; background: var(--ground); color: var(--ink); }
  .statusbar { position: absolute; inset: 0 0 auto 0; height: var(--safe-top); z-index: 10; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 10px; font-weight: 600; font-size: 16px; color: var(--chrome); pointer-events: none; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
  .statusbar svg { height: 12px; fill: var(--chrome); }
  .home-indicator { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 10; width: 134px; height: 5px; border-radius: 3px; background: var(--chrome); opacity: .9; pointer-events: none; }
  #screen { position: absolute; inset: 0; overflow: clip; } /* clip: focus and scrollIntoView must never scroll the device itself */
</style>
<style>
  /* PRODUCT TOKENS: native-quiet direction, dealt for "Söz" */
  :root {
    --font: "Public Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, sans-serif;
    --ground: #FFFFFF; --raised: #F2F2F7; --ink: #000000; --ink-2: #5E5E63; --line: #D8D8DC;
    --accent: #B85C00; --on-accent: #FFFFFF; --positive: #2E7D46; --negative: #D4442E;
    --t-large: 700 34px/41px var(--font); --t-title: 600 22px/28px var(--font); --t-head: 600 17px/22px var(--font);
    --t-body: 400 17px/22px var(--font); --t-foot: 400 13px/18px var(--font);
    --r-group: 12px; --r-btn: 10px; --gap: 20px; --side: 16px;
    --tabbar: calc(49px + var(--safe-bottom));
  }
  [data-theme="dark"] {
    --ground: #000000; --raised: #1C1C1E; --ink: #FFFFFF; --ink-2: #A1A1A6; --line: #38383A;
  }
</style>
<style>
  body { font: var(--t-body); }
  h1, h2, h3, p, dl, dd { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation;
    transition: transform .12s cubic-bezier(.22,1,.36,1); -webkit-tap-highlight-color: transparent; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { cursor: default; }
  .num { font-variant-numeric: tabular-nums; }
  .ph-wrap { position: relative; overflow: hidden; background: var(--c); }
  .ph-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .4s ease-out; }
  .ph-wrap img.in { opacity: 1; }

  /* scrolling panels; the status bar strip stays opaque so nothing reads through it */
  .panel { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: var(--safe-top) 0 calc(var(--tabbar) + 24px); }
  .panel[hidden] { display: none; }
  .topstrip { position: absolute; inset: 0 0 auto 0; height: var(--safe-top); background: var(--ground); z-index: 6; }
  .navbar { display: flex; align-items: flex-end; justify-content: space-between; padding: 4px var(--side) 8px; min-height: 53px; }
  .navbar h1 { font: var(--t-large); letter-spacing: -0.02em; }
  .streak { text-align: right; }
  .streak b { font: var(--t-head); display: block; }
  .streak > span { font: var(--t-foot); color: var(--ink-2); }
  .sub { font: var(--t-foot); color: var(--ink-2); padding: 0 var(--side) 8px; }

  .note { display: flex; gap: 10px; align-items: center; margin: 0 var(--side) 8px; padding: 10px 12px; border-radius: var(--r-group); background: var(--raised); font: var(--t-foot); }
  .note i { font-size: 20px; }

  /* today's lesson: the brand surface, filled with the tea-glass amber */
  .today { margin: 8px var(--side) 0; padding: 16px; border-radius: var(--r-group); background: var(--accent); color: var(--on-accent); }
  .t-top { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
  .t-meta { font: var(--t-foot); }
  .t-top h2 { font: 700 30px/36px var(--font); letter-spacing: -0.01em; margin-top: 2px; }
  .t-sub { font: var(--t-body); }
  .t-photo { flex: none; width: 88px; height: 88px; border-radius: 10px; }
  .t-phrase { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
  .speak { flex: none; width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; font-size: 22px; }
  .today .speak { border: 1.5px solid var(--on-accent); }
  .speak.on { background: var(--on-accent); color: var(--accent); }
  .t-tr { font: var(--t-head); }
  .t-en { font: var(--t-foot); }
  .t-scope { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgb(255 255 255 / .45); }
  .t-scope dt { font: var(--t-foot); }
  .t-scope dd { font: var(--t-head); font-variant-numeric: tabular-nums; }
  .btn-light { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin-top: 14px; border-radius: var(--r-btn);
    background: #FFFFFF; color: #8A4500; font: var(--t-head); }
  .done-line { display: flex; gap: 8px; align-items: center; font: var(--t-foot); margin: 0 0 12px; }
  .done-line i { font-size: 18px; }

  /* sections */
  .sec { margin-top: var(--gap); }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 var(--side); min-height: 44px; }
  .sec-head h2 { font: var(--t-title); }
  .group { margin: 8px var(--side) 0; border-radius: var(--r-group); background: var(--raised); }
  .course-row { display: block; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--r-group); }
  .c-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .c-line .ph { font-size: 18px; color: var(--ink-2); align-self: center; }
  .c-pct { font: var(--t-head); font-variant-numeric: tabular-nums; margin-left: auto; }
  .steps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 12px 0 10px; }
  .steps span { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .steps span i { display: block; height: 100%; width: var(--f, 0%); background: var(--accent); }
  .c-foot { display: flex; justify-content: space-between; gap: 12px; font: var(--t-foot); color: var(--ink-2); }
  .btn-out { min-height: 44px; padding: 0 16px; border-radius: var(--r-btn); border: 1.5px solid var(--accent); color: var(--accent); font: var(--t-head); background: var(--ground);
    display: inline-flex; align-items: center; gap: 8px; }
  [data-theme="dark"] .btn-out { color: #FFFFFF; }
  .words { list-style: none; margin: 4px 0 0; padding: 0 0 0 var(--side); }
  .words li { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px var(--side) 6px 0; border-bottom: 1px solid var(--line); }
  .words li:last-child { border-bottom: 0; }
  .w-text { flex: 1; min-width: 0; }
  .w-tr { font: var(--t-head); }
  .w-en { font: var(--t-foot); color: var(--ink-2); }
  .meter { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .bars { display: flex; gap: 3px; }
  .bars i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); }
  .bars i.f { background: var(--accent); }
  .meter span { font: var(--t-foot); color: var(--ink-2); }
  .empty { margin: 8px var(--side) 0; padding: 20px 16px; border-radius: var(--r-group); background: var(--raised); display: grid; justify-items: start; gap: 6px; }
  .empty i { font-size: 28px; color: var(--ink-2); }
  .empty b { font: var(--t-head); }
  .empty p { font: var(--t-foot); color: var(--ink-2); }
  .err { margin: 8px var(--side) 0; padding: 16px; border-radius: var(--r-group); background: var(--raised); display: grid; gap: 6px; }
  .err i { font-size: 28px; color: var(--negative); }
  .err b { font: var(--t-head); }
  .err p { font: var(--t-foot); color: var(--ink-2); }
  .btn-acc { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: var(--r-btn); background: var(--accent); color: var(--on-accent); font: var(--t-head); }
  .sk { background: var(--raised); border-radius: var(--r-group); margin: 8px var(--side) 0; }

  /* units list (Course tab) */
  .units { list-style: none; margin: 8px var(--side) 0; padding: 0; border-radius: var(--r-group); background: var(--raised); }
  .units li { display: flex; gap: 12px; align-items: center; min-height: 56px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .units li:last-child { border-bottom: 0; }
  .units .u-n { font: var(--t-foot); color: var(--ink-2); width: 60px; flex: none; }
  .units .u-t { flex: 1; min-width: 0; }
  .units .u-t b { font: var(--t-head); display: block; }
  .units .u-t span { font: var(--t-foot); color: var(--ink-2); }
  .units .u-s { font: var(--t-foot); color: var(--ink-2); display: flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
  .units .u-s.cur { color: var(--ink); font-weight: 600; }
  .units .u-s .ph-fill { color: var(--positive); font-size: 18px; }

  /* tab bar */
  .tabbar { position: absolute; inset: auto 0 0 0; height: var(--tabbar); padding-bottom: var(--safe-bottom); z-index: 7; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--ground); border-top: 1px solid var(--line); }
  .tabbar button { display: grid; justify-items: center; align-content: center; gap: 2px; font: 600 10px/12px var(--font); color: var(--ink-2); min-height: 49px; }
  .tabbar button i { font-size: 26px; }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  [data-theme="dark"] .tabbar button[aria-current="page"] { color: #E07A1F; }

  /* lesson: a full-screen step with its own exit */
  #lesson { position: absolute; inset: 0; z-index: 8; background: var(--ground); padding-top: var(--safe-top); display: flex; flex-direction: column;
    transform: translateY(100%); visibility: hidden; transition: transform .34s cubic-bezier(.2,.8,.2,1), visibility 0s .34s; }
  #lesson.open { transform: none; visibility: visible; transition: transform .34s cubic-bezier(.2,.8,.2,1); }
  .l-head { display: flex; align-items: center; gap: 12px; padding: 0 var(--side) 0 8px; min-height: 52px; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; font-size: 24px; border-radius: 22px; flex: none; }
  .l-prog { flex: 1; display: grid; gap: 4px; }
  .l-prog .segs { display: flex; gap: 3px; }
  .l-prog .segs i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .l-prog .segs i.f { background: var(--accent); }
  .l-count { font: var(--t-foot); color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .l-body { flex: 1; padding: 20px var(--side) 0; display: flex; flex-direction: column; }
  .l-body h2 { font: var(--t-head); color: var(--ink-2); outline: none; }
  .l-phrase { display: flex; gap: 14px; align-items: center; margin: 14px 0 22px; }
  .l-phrase .speak { border: 1.5px solid var(--line); color: var(--ink); }
  .l-phrase p { font: 700 28px/34px var(--font); }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 16px; border-radius: var(--r-btn); text-align: left;
    background: var(--ground); border: 1.5px solid var(--line); font: var(--t-body); color: var(--ink); }
  .opt[aria-pressed="true"] { border-color: var(--accent); border-width: 2.5px; font-weight: 600; }
  .opt:disabled { opacity: 1; }
  .l-foot { padding: 16px var(--side) calc(var(--safe-bottom) + 12px); margin-top: auto; }
  .btn-acc:disabled { background: var(--raised); color: var(--ink-2); }

  /* feedback: docked at the bottom of the lesson, the chosen tile lands in it */
  #fb { position: absolute; inset: auto 0 0 0; padding: 16px var(--side) calc(var(--safe-bottom) + 12px); border-radius: 16px 16px 0 0; color: #FFFFFF; view-transition-name: fb; z-index: 2; }
  #fb[hidden] { display: none; }
  #fb.ok { background: var(--positive); }
  #fb.no { background: var(--negative); }
  .fb-title { display: flex; align-items: center; gap: 8px; font: var(--t-title); }
  .fb-title i { font-size: 28px; }
  .echo { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px; margin-top: 12px; border-radius: var(--r-btn); background: #FFFFFF; color: #000000; font: 600 17px/22px var(--font); }
  .echo i { font-size: 22px; margin-left: auto; }
  #fb.ok .echo i { color: var(--positive); }
  #fb.no .echo i { color: var(--negative); }
  .fb-ans { font: var(--t-head); margin-top: 12px; }
  .fb-why { font: 400 16px/22px var(--font); margin-top: 6px; }
  .fb-row { display: flex; gap: 10px; margin-top: 16px; }
  .fb-row .speak { border: 1.5px solid #FFFFFF; color: #FFFFFF; width: 50px; height: 50px; border-radius: var(--r-btn); }
  .btn-white { flex: 1; min-height: 50px; border-radius: var(--r-btn); background: #FFFFFF; color: #000000; font: var(--t-head); }
  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-group(ans) { z-index: 3; }
    ::view-transition-new(fb) { animation: fb-in .2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes fb-in { from { opacity: 0; } }
  }

  /* lesson complete */
  .done { padding: 28px var(--side) 0; flex: 1; display: flex; flex-direction: column; }
  .done h2 { font: var(--t-large); letter-spacing: -0.02em; outline: none; }
  .done .d-sub { font: var(--t-body); color: var(--ink-2); margin-top: 4px; }
  .score { margin-top: 28px; }
  .score .c-line b { font: var(--t-title); font-variant-numeric: tabular-nums; }
  .score .track { height: 12px; border-radius: 6px; background: var(--raised); margin-top: 10px; overflow: hidden; }
  .score .track i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transform-origin: left; }
  .facts { margin-top: 24px; border-radius: var(--r-group); background: var(--raised); }
  .facts div { display: flex; justify-content: space-between; min-height: 48px; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .facts div:last-child { border-bottom: 0; }
  .facts dd { font: var(--t-head); font-variant-numeric: tabular-nums; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { *, ::view-transition-group(*) { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div class="statusbar">
    <span id="clock">10:08</span>
    <svg viewBox="0 0 66 12" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/>
      <rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/>
      <path d="M31 2.2a9 9 0 0 1 7 3l-1.5 1.5a7 7 0 0 0-11 0L24 5.2a9 9 0 0 1 7-3zm0 4a5 5 0 0 1 4 2l-4 4-4-4a5 5 0 0 1 4-2z"/>
      <rect x="44" y="0.5" width="19" height="11" rx="3" fill="none" style="stroke: var(--chrome)" opacity=".5"/>
      <rect x="45.5" y="2" width="14" height="8" rx="1.8"/><rect x="64" y="4" width="1.6" height="4" rx=".8" opacity=".5"/>
    </svg>
  </div>

  <main id="screen">
    <div class="topstrip"></div>
    <section class="panel" id="p-today" aria-label="Today"></section>
    <section class="panel" id="p-course" aria-label="Course" hidden></section>
    <section class="panel" id="p-words" aria-label="Words" hidden></section>

    <nav class="tabbar" aria-label="Tabs">
      <button data-act="tab" data-tab="today" aria-current="page"><i class="ph-fill ph-house"></i>Today</button>
      <button data-act="tab" data-tab="course"><i class="ph ph-path"></i>Course</button>
      <button data-act="tab" data-tab="words"><i class="ph ph-cards"></i>Words</button>
    </nav>

    <section id="lesson" role="dialog" aria-modal="true" aria-labelledby="l-title" inert>
      <div class="l-head">
        <button class="icon-btn" data-act="close" aria-label="Close, progress is saved"><i class="ph ph-x"></i></button>
        <div class="l-prog"><div class="segs" id="segs"></div></div>
        <span class="l-count" id="l-count"></span>
      </div>
      <div id="l-main" style="flex:1;display:flex;flex-direction:column"></div>
      <div id="fb" hidden aria-live="polite"></div>
    </section>
    <p class="sr" id="live" aria-live="polite"></p>
  </main>

  <div class="home-indicator"></div>
  <script>document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M$/i, '');</script>
  <script>/* motion-kit.js (mobile-ui-craft 5.0). Zero dependencies. Inline it in one <script> of the prototype; it defines window.MK.
   Everything that should be filmable runs on WAAPI or view transitions, which scripts/capture.mjs `film:` slows down.
   requestAnimationFrame is used only for MK.tilt smoothing (pointer-driven, not filmed); never build a filmed move on it.
   Springs are CSS linear() easings generated at mass 1; the tokens are the Material 3 Expressive stiffness/damping pairs. */
(() => {
  const MK = (window.MK = { out: 'cubic-bezier(.2,.8,.2,1)' }); // out: for fades and menus, never for springs
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  MK.reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Spring as a linear() easing: stiffness k, damping ratio zeta (<= 1). ms is the time to settle within 0.2%.
  MK.spring = (k, zeta, pts = 36) => {
    const w0 = Math.sqrt(k), wd = w0 * Math.sqrt(Math.max(1e-6, 1 - zeta * zeta));
    const x = zeta < 1
      ? (t) => 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + (zeta * w0 / wd) * Math.sin(wd * t))
      : (t) => 1 - Math.exp(-w0 * t) * (1 + w0 * t);
    let T = 0.02;
    while (T < 10 && !(Math.abs(1 - x(T)) < 0.002 && Math.abs(1 - x(T + 0.15)) < 0.002)) T += 0.01;
    const v = Array.from({ length: pts + 1 }, (_, i) => +x((T * i) / pts).toFixed(3));
    v[pts] = 1;
    return { easing: `linear(${v.join(', ')})`, ms: Math.round(T * 1000) };
  };
  // spatial moves things and may overshoot; effects (opacity, colour) must not overshoot
  MK.ease = { spatial: MK.spring(380, 0.8), fast: MK.spring(800, 0.6), slow: MK.spring(200, 0.8), effects: MK.spring(1600, 1) };

  // Shared-element and state morphs. Give the two ends the same view-transition-name (unique, set only while morphing).
  let vtStyle;
  MK.morph = (update, opts = {}) => {
    if (!document.startViewTransition || document.visibilityState !== 'visible') return Promise.resolve(update()).then(() => {});
    if (!vtStyle) {
      const e = MK.ease.spatial;
      vtStyle = document.head.appendChild(document.createElement('style'));
      // under Reduce Motion the named groups jump and only the page crossfades.
      // The page fades out before the new one fades in: a simultaneous crossfade shows old and new text on top of each other.
      vtStyle.textContent = `::view-transition-group(*){animation-duration:${e.ms}ms;animation-timing-function:${e.easing}}
::view-transition-group(root){animation-duration:200ms;animation-timing-function:ease-out}
::view-transition-old(root){animation:mk-vt-out 90ms ease-out both}::view-transition-new(root){animation:mk-vt-in 150ms 60ms ease-out both}
@keyframes mk-vt-out{to{opacity:0}}@keyframes mk-vt-in{from{opacity:0}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*){animation-duration:.01ms}::view-transition-group(root){animation-duration:150ms}}`;
    }
    const typed = opts.types && window.ViewTransition && 'types' in ViewTransition.prototype;
    const vt = typed ? document.startViewTransition({ update, types: opts.types }) : document.startViewTransition(update);
    vt.ready.catch(() => {}); // a skipped transition rejects ready; the update still ran, so finished is what we return
    return vt.finished;
  };

  // Commit the on-screen transform and stop animations, so a grab or a new move starts from where the element is.
  MK.freeze = (el) => {
    const cs = getComputedStyle(el), t = cs.transform, tr = cs.translate, sc = cs.scale; // read before cancel: computed values are live
    el.getAnimations().forEach((a) => a.cancel());
    el.style.transform = t === 'none' ? '' : t;
    el.style.translate = tr === 'none' ? '' : tr; // MK.flip animates these two, so a mid-flip grab needs them too
    el.style.scale = sc === 'none' ? '' : sc;
  };

    }
    S.run = null;
    const el = document.getElementById('lesson');
    el.classList.remove('open'); el.inert = true;
    document.getElementById('fb').hidden = true;
    document.querySelectorAll('.panel, .tabbar').forEach((p) => (p.inert = false));
    const before = { streak: S.streak0, pct: S.pct0 };
    renderAll();
    const target = S.opener && document.querySelector(`[data-act="${S.opener}"]`);
    (target || document.getElementById('p-today')).focus({ preventScroll: true });
    // detail motion: changed figures roll once the lesson has slid away
    if (before.streak !== undefined) setTimeout(() => {
      rollFrom('streak-n', before.streak, String(S.streak)); rollFrom('pct-n', before.pct, `${pct()}%`);
      S.streak0 = S.pct0 = undefined;
    }, 340);
  }
  function rollFrom(id, from, to) {
    const el = document.getElementById(id); if (!el || from === to) return;
    MK.roll(el, from); MK.roll(el, to);
  }

  function renderEx() {
    const r = S.run, main = document.getElementById('l-main'), n = r.ex.length;
    document.getElementById('segs').innerHTML = r.ex.map((_, k) => `<i class="${k < r.i + (r.answered || r.finished ? 1 : 0) ? 'f' : ''}"></i>`).join('');
    document.getElementById('l-count').textContent = r.finished ? `${n} of ${n}` : `${r.i + 1} of ${n}`;
    document.getElementById('fb').hidden = true;
    if (r.finished) return renderDone();
    const [q, opts] = r.ex[r.i];
    const order = [0, 1, 2].map((k) => (k + r.i) % 3); // the right answer moves around
    main.innerHTML = `<div class="l-body">
        <h2 id="l-title" tabindex="-1">${r.mode === 'lesson' ? 'What does this mean?' : 'What does this word mean?'}</h2>
        <div class="l-phrase"><button class="speak" data-act="speak" data-say="${esc(q)}" aria-label="Play ${esc(q)}"><i class="ph ph-speaker-high"></i></button><p lang="tr">${esc(q)}</p></div>
        <div class="opts" role="group" aria-label="Answers">${order.map((k) => `<button class="opt" data-act="pick" data-k="${k}" aria-pressed="${r.picked === k}">${esc(opts[k])}</button>`).join('')}</div>
      </div>
      <div class="l-foot"><button class="btn-acc" data-act="check" id="check" ${r.picked == null ? 'disabled' : ''}>${r.picked == null ? 'Choose an answer' : 'Check'}</button></div>`;
  }

  function check() {
    const r = S.run; if (r.picked == null || r.answered) return;
    const [q, opts, why, word] = r.ex[r.i], ok = r.picked === 0;
    const tile = document.querySelector(`.opt[data-k="${r.picked}"]`), fb = document.getElementById('fb');
    r.answered = true; r.lastOk = ok;
    MK.haptic(ok ? 'success' : 'error');
    tile.style.viewTransitionName = 'ans';
    MK.morph(() => {
      tile.style.viewTransitionName = '';
      document.querySelectorAll('.opt').forEach((b) => (b.disabled = true));
      document.getElementById('check').hidden = true;
      fb.className = ok ? 'ok' : 'no';
      fb.innerHTML = `<p class="fb-title"><i class="ph-fill ${ok ? 'ph-check-circle' : 'ph-x-circle'}" aria-hidden="true"></i>${ok ? 'Correct' : 'Not quite'}</p>
        <div class="echo" id="echo"><span>${esc(opts[r.picked])}</span><i class="ph-fill ${ok ? 'ph-check-circle' : 'ph-x-circle'}" aria-hidden="true"></i></div>
        ${ok ? '' : `<p class="fb-ans">Answer: ${esc(opts[0])}</p>`}
        <p class="fb-why">${esc(why)}</p>
        <div class="fb-row"><button class="speak" data-act="speak" data-say="${esc(q)}" aria-label="Play ${esc(q)} again"><i class="ph ph-speaker-high"></i></button>
          <button class="btn-white" data-act="next" id="next">Continue</button></div>`;
      fb.hidden = false;
      document.getElementById('echo').style.viewTransitionName = 'ans';
      document.querySelectorAll('#segs i')[r.i].classList.add('f');
    }).then(() => {
      const e = document.getElementById('echo'); if (e) e.style.viewTransitionName = '';
      document.getElementById('next')?.focus({ preventScroll: true });
    });
    if (ok) r.correct++;
    if (word) word.s = Math.max(1, Math.min(4, word.s + (ok ? 1 : 0)));
  }

  function next() {
    const r = S.run; r.i++; r.picked = null; r.answered = false;
    if (r.i >= r.ex.length) {
      r.finished = true; r.i = r.ex.length - 1;
      if (r.mode === 'lesson') {
        S.streak0 = String(S.streak); S.pct0 = `${pct()}%`;
        if (!S.doneToday) { S.streak++; S.doneToday = true; }
        S.saved = null; S.li = Math.min(S.li + 1, LESSONS.length - 1);
      }
      MK.haptic('success');
    }
    renderEx();
    document.getElementById('l-title')?.focus({ preventScroll: true });
  }

  function renderDone() {
    const r = S.run, n = r.ex.length, L = r.lesson;
    const main = document.getElementById('l-main');
    const facts = r.mode === 'lesson'
      ? `<div><dt>New words</dt><dd>${L.newWords}</dd></div><div><dt>Streak</dt><dd>${S.streak} days</dd></div><div><dt>Course</dt><dd>${pct()}% done</dd></div>`
      : `<div><dt>Words practised</dt><dd>${n}</dd></div><div><dt>Still weak</dt><dd>${weak().length}</dd></div>`;
    main.innerHTML = `<div class="done">
        <h2 id="l-title" tabindex="-1">${r.mode === 'lesson' ? `<span lang="tr">${L.tr}</span> done` : 'Practice done'}</h2>
        <p class="d-sub">${r.mode === 'lesson' ? `Unit 4, lesson ${L.n} of ${PER_UNIT}` : 'Weak words'}</p>
        <div class="score"><div class="c-line"><span>Correct</span><b>${r.correct} of ${n}</b></div><div class="track"><i id="fill"></i></div></div>
        <dl class="facts">${facts}</dl>
      </div>
      <div class="l-foot"><button class="btn-acc" data-act="close-done">Back to today</button></div>`;
    document.getElementById('live').textContent = `${r.correct} of ${n} correct`;
    // the score bar fills once to the real score
    const f = document.getElementById('fill'), to = r.correct / n, e = MK.ease.spatial;
    f.style.transform = `scaleX(${to})`;
    if (!MK.reduced()) f.animate([{ transform: 'scaleX(0)' }, { transform: `scaleX(${to})` }], { duration: e.ms + 200, easing: e.easing, delay: 120, fill: 'backwards' });
  }

  // ---------- audio: the device's Turkish voice; text is always on screen too ----------
  function speak(btn) {
    const t = btn.dataset.say;
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'tr-TR'; u.rate = 0.85;
    btn.classList.add('on'); u.onend = u.onerror = () => btn.classList.remove('on');
    speechSynthesis.speak(u);
  }

  // ---------- actions ----------
  const ACT = {
    tab(b) {
      S.tab = b.dataset.tab;
      document.querySelectorAll('.tabbar button').forEach((t) => {
        const on = t.dataset.tab === S.tab; t.toggleAttribute('aria-current', on); if (on) t.setAttribute('aria-current', 'page');
        t.querySelector('i').className = `${on ? 'ph-fill' : 'ph'} ${t.querySelector('i').className.split(' ').pop()}`;
      });
      ['today', 'course', 'words'].forEach((k) => (document.getElementById(`p-${k}`).hidden = k !== S.tab));
    },
    start() {
      const L = LESSONS[S.li], ex = L.ex || wordExercises(WORDS.slice(0, 8));
      const sv = S.saved && S.saved.li === S.li ? S.saved : null;
      openRun({ mode: 'lesson', lesson: L, ex, i: sv ? sv.i : 0, correct: sv ? sv.correct : 0, picked: null, answered: false }, 'start');
    },
    practise() { openRun({ mode: 'practise', ex: wordExercises(weak()), i: 0, correct: 0, picked: null, answered: false }, 'practise'); },
    pick(b) {
      if (S.run.answered) return;
      S.run.picked = +b.dataset.k; MK.haptic('selection');
      document.querySelectorAll('.opt').forEach((o) => o.setAttribute('aria-pressed', o === b));
      const c = document.getElementById('check'); c.disabled = false; c.textContent = 'Check';
    },
    check, next,
    close: closeRun,
    'close-done': closeRun,
    speak,
    retry() { history.replaceState(null, '', location.pathname + location.search); renderAll(); },
  };
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    ACT[b.dataset.act]?.(b);
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.run) closeRun(); });
  addEventListener('hashchange', () => { document.documentElement.dataset.state = stateNow(); renderAll(); });
  document.documentElement.dataset.state = stateNow();
  renderAll();
  </script>
</body>
</html>
