<!doctype html>
<html lang="tr" data-platform="ios" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kıvılcım Keşfet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<script>/* the designed appearance is light; ?theme=dark shows the other one */
(() => { const t = new URLSearchParams(location.search).get('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; })();</script>
<style>
  /* device frame (assets/phone-frame.html) */
  :root { --w: 393px; --h: 852px; --safe-top: 59px; --safe-bottom: 34px; --chrome: #000; }
  [data-theme="dark"], [data-viewer] { --chrome: #fff; }
  [data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; }
  body { position: relative; font-family: var(--font); -webkit-font-smoothing: antialiased; background: var(--ground); color: var(--ink); }
  .statusbar { position: absolute; inset: 0 0 auto 0; height: var(--safe-top); z-index: 10; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 10px; font: 600 16px -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--chrome); pointer-events: none; }
  .statusbar svg { height: 12px; fill: var(--chrome); }
  .home-indicator { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 10; width: 134px; height: 5px; border-radius: 3px; background: var(--chrome); opacity: .9; pointer-events: none; }
  #screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
</style>
<style>
  /* PRODUCT TOKENS: Kıvılcım, direction photo-editorial. Screens below use only these. */
  :root {
    --ground: #FFFFFF; --raised: #F7F7F7; --ink: #1A1A1A; --ink-2: #5F5F5F; --line: #EBEBEB;
    --accent: #111111; --on-accent: #FFFFFF; --positive: #1F7A4C; --negative: #D93B30;
    --scrim: rgb(0 0 0 / .45); --viewer: #000; --on-viewer: #fff; --viewer-btn: rgb(255 255 255 / .16);
    --font: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, sans-serif;
    /* type roles (rem, so the user's text size scales them) */
    --t-hero: 700 2.75rem/1.05 var(--font);      /* the person's name: 44 */
    --t-title: 700 1.75rem/1.1 var(--font);      /* 28 */
    --t-answer: 600 1.375rem/1.3 var(--font);    /* prompt answers: 22 */
    --t-section: 600 1.25rem/1.25 var(--font);   /* 20 */
    --t-body: 400 1rem/1.45 var(--font);         /* 16 */
    --t-label: 600 1.0625rem/1.2 var(--font);    /* buttons: 17 */
    --t-meta: 400 .875rem/1.4 var(--font);       /* 14 */
    --t-tab: 600 .75rem/1 var(--font);           /* 12 */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r-chip: 10px; --r-btn: 14px; --r-card: 16px;
    --press: 120ms; --fade: 180ms;
    --wash: 26%;  /* how much of the photo's colour tints the common-ground band */
  }
  [data-theme="dark"] {
    --ground: #0A0A0A; --raised: #1A1A1A; --ink: #FFFFFF; --ink-2: #B3B3B3; --line: #2A2A2A;
    --accent: #FFFFFF; --on-accent: #0A0A0A; --positive: #3DB87A; --negative: #F0605A;
    --scrim: rgb(0 0 0 / .6); --wash: 30%;
  }
</style>
<style>
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: transform var(--press) cubic-bezier(.22,1,.36,1), opacity var(--fade) ease-out; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 4px var(--ground); }
  h1, h2, h3, p { margin: 0; }

  /* navigation bar */
  .nav { flex: none; height: calc(var(--safe-top) + 52px); padding: var(--safe-top) var(--s4) 0; display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    background: var(--ground); border-bottom: 1px solid transparent; transition: border-color var(--fade) ease-out; position: relative; z-index: 2; }
  .nav.scrolled { border-color: var(--line); }
  .nav h1 { font: var(--t-title); letter-spacing: -.02em; white-space: nowrap; }
  .compact { display: flex; align-items: center; gap: 6px; font: 600 1rem/1 var(--font); min-width: 0; opacity: 0; transform: translateY(4px); transition: opacity var(--fade) ease-out, transform var(--fade) ease-out; }
  .compact span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav.scrolled .compact { opacity: 1; transform: none; }

  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }

  /* never-grey photo slot */
  .slot { position: relative; overflow: hidden; background: var(--c); margin: 0; }
  .slot img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease-out; display: block; }
  .slot img.in { opacity: 1; }
  /* both ends are centre crops of one photo: show only the new one, so the box grows without a double image */
  ::view-transition-old(photo) { animation: none; opacity: 0; }
  ::view-transition-new(photo) { animation: none; height: 100%; width: 100%; object-fit: cover; }

  /* profile */
  .who { padding: var(--s1) var(--s4) var(--s4); }
  .name { font: var(--t-hero); letter-spacing: -.03em; display: flex; flex-wrap: wrap; align-items: center; column-gap: 10px; }
  .verified { font-size: 1.75rem; }
  .meta { font: var(--t-meta); color: var(--ink-2); margin-top: 6px; }
  .hero { height: 304px; }
  .inline { height: 440px; margin: var(--s4) var(--s4) 0; border-radius: var(--r-card); }
  .photo-open { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
  .photo-open:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }
  .like-photo { position: absolute; right: var(--s3); bottom: var(--s3); width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--ground); color: var(--ink); display: grid; place-items: center; font-size: 24px; }

  .common { background: color-mix(in oklab, var(--tint) var(--wash), var(--ground)); padding: 20px var(--s4) var(--s5); transition: background-color .6s ease-out; }
  .common h3 { font: var(--t-section); margin-bottom: var(--s3); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s2); list-style: none; margin: 0; padding: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 var(--s3); border-radius: var(--r-chip); font: 600 .9375rem/1 var(--font); }
  .chip.on { background: var(--accent); color: var(--on-accent); }
  .chip.off { color: var(--ink-2); font-weight: 400; border: 1px solid color-mix(in oklab, var(--ink) 24%, transparent); }

  .prompt { margin: var(--s4) var(--s4) 0; background: var(--raised); border-radius: var(--r-card); padding: 20px 20px var(--s3); }
  .q { font: 600 .875rem/1.3 var(--font); color: var(--ink-2); margin-bottom: var(--s2); }
  .a { font: var(--t-answer); letter-spacing: -.01em; }
  .prompt .row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s3); min-height: 48px; }
  .tag { font: var(--t-meta); display: inline-flex; align-items: center; gap: 6px; }
  .like-btn { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--ground); color: var(--ink); display: grid; place-items: center; font-size: 24px; }
  .safety { margin: var(--s6) var(--s4) var(--s5); padding-top: var(--s2); border-top: 1px solid var(--line); }
  .safety button { display: flex; align-items: center; gap: var(--s2); min-height: 48px; padding: 0; border: 0; background: none; font: var(--t-body); color: var(--ink-2); }
  .safety i { font-size: 20px; }

  .offline { display: flex; gap: 10px; align-items: center; margin: 0 var(--s4) var(--s3); padding: var(--s3); border-radius: var(--s3); background: var(--raised); font: var(--t-meta); }
  .offline i { font-size: 20px; flex: none; }
  .state { padding: var(--s6) var(--s5); }
  .state h2 { font: var(--t-title); letter-spacing: -.02em; margin-bottom: var(--s2); }
  .state p { font: var(--t-body); color: var(--ink-2); margin-bottom: var(--s5); }
  .sk { background: var(--raised); border-radius: var(--s2); }

  /* docked decision bar: receipt and Undo live here, never in a toast */
  .actionbar { flex: none; background: var(--ground); border-top: 1px solid var(--line); padding: 10px var(--s4) var(--s3); }
  .receipt { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 44px; margin-bottom: 6px; }
  .receipt p { font: 400 .9375rem/1.3 var(--font); }
  .link { min-height: 44px; padding: 0 var(--s2); border: 0; background: none; font: 600 .9375rem/1 var(--font); text-decoration: underline; text-underline-offset: 3px; flex: none; }
  .decide { display: grid; grid-template-columns: 1fr 1.5fr; gap: var(--s3); }
  .btn { min-height: 54px; border-radius: var(--r-btn); border: 0; display: flex; align-items: center; justify-content: center; gap: var(--s2); font: var(--t-label); padding: 0 var(--s4); }
  .btn i { font-size: 22px; }
  .btn-1 { background: var(--accent); color: var(--on-accent); }
  .btn-2 { background: var(--raised); color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: var(--negative); color: var(--ground); }
  .btn-sm { min-height: 44px; font-size: .9375rem; flex: 1; }
  .btn-full { width: 100%; margin-top: var(--s4); }

  /* tab bar */
  .tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--ground); border-top: 1px solid var(--line); padding-bottom: var(--safe-bottom); }
  .tab { position: relative; min-height: 50px; border: 0; background: none; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: var(--t-tab); }
  .tab i { font-size: 26px; }
  .tab[aria-current="page"] { color: var(--ink); }
  .badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font: 600 .75rem/18px var(--font); font-variant-numeric: tabular-nums; }

  /* other tabs */
  .person { display: grid; grid-template-columns: 56px 1fr; gap: var(--s3); padding: var(--s4); border-bottom: 1px solid var(--line); }
  .avatar { width: 56px; height: 56px; border-radius: 50%; }
  .pname { font: 600 1.0625rem/1.3 var(--font); }
  .psub { font: var(--t-meta); color: var(--ink-2); margin-top: 2px; }
  .note { font: var(--t-body); background: var(--raised); border-radius: var(--s3); padding: 10px var(--s3); margin-top: var(--s2); }
  .pact { display: flex; gap: var(--s2); margin-top: var(--s3); align-items: center; }
  .pact p { flex: 1; font: var(--t-body); }
  .chat-time { font: var(--t-meta); color: var(--ink-2); }
  .sect { font: var(--t-section); padding: var(--s5) var(--s4) var(--s3); }
  .me-head { display: flex; gap: var(--s4); align-items: center; padding: var(--s2) var(--s4) var(--s2); }
  .me-photo { width: 88px; height: 88px; border-radius: 50%; flex: none; }
  .pad { padding: 0 var(--s4); }
  .chip.mine { border: 1px solid color-mix(in oklab, var(--ink) 24%, transparent); }
  .end-pad { height: var(--s6); }

  /* photo viewer: the hero photo grows into it */
  #viewer { position: absolute; inset: 0; z-index: 8; background: var(--viewer); color: var(--on-viewer); display: flex; flex-direction: column; }
  .v-top { height: calc(var(--safe-top) + 56px); padding: var(--safe-top) var(--s2) 0; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; }
  .v-count { text-align: center; font: 600 1rem/1 var(--font); font-variant-numeric: tabular-nums; }
  .v-track { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .v-track::-webkit-scrollbar { display: none; }
  .v-slide { flex: none; width: 100%; scroll-snap-align: center; display: grid; place-items: center; }
  .v-slide .slot { width: 100%; aspect-ratio: 4 / 5; }
  .v-bot { display: flex; justify-content: space-between; padding: var(--s3) var(--s4) calc(var(--safe-bottom) + var(--s3)); }
  .icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--viewer-btn); color: var(--on-viewer); display: grid; place-items: center; font-size: 24px; }
  #viewer :focus-visible { outline-color: #fff; box-shadow: none; }

  /* sheet */
  #scrim { position: absolute; inset: 0; z-index: 8; background: var(--scrim); }
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--ground); border-radius: var(--r-card) var(--r-card) 0 0;
    padding: var(--s2) var(--s4) calc(var(--safe-bottom) + var(--s4)); max-height: calc(100% - var(--safe-top) - var(--s4)); overflow-y: auto; }
  .handle { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto var(--s1); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 52px; margin-bottom: var(--s2); }
  .sheet-head h2 { font: var(--t-section); }
  .plain-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--raised); color: var(--ink); display: grid; place-items: center; font-size: 20px; }
  .quote { background: var(--raised); border-radius: var(--r-card); padding: var(--s4); }
  .quote .slot { height: 200px; border-radius: var(--s3); }
  .quote.photo { padding: 0; background: none; }
  .field-label { display: block; font: 600 .875rem/1.3 var(--font); margin: 20px 0 6px; }
  textarea { width: 100%; min-height: 88px; border: 1px solid color-mix(in oklab, var(--ink) 24%, transparent); border-radius: var(--s3); padding: var(--s3); font: var(--t-body); background: var(--ground); color: var(--ink); resize: none; }
  .count { font: 400 .8125rem/1.3 var(--font); color: var(--ink-2); text-align: right; margin-top: var(--s1); font-variant-numeric: tabular-nums; }
  .opt { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 72px; padding: var(--s3) var(--s4); margin-top: var(--s2); text-align: left; border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--ground); }
  .opt i { font-size: 24px; flex: none; }
  .opt b { display: block; font: var(--t-label); }
  .opt span { display: block; font: var(--t-meta); color: var(--ink-2); margin-top: 2px; }
  .sheet-p { font: var(--t-body); color: var(--ink-2); }
  .reason { display: flex; align-items: center; gap: var(--s3); min-height: 52px; border-bottom: 1px solid var(--line); font: var(--t-body); }
  .reason input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
  .err { font: 600 .875rem/1.3 var(--font); color: var(--negative); margin-top: var(--s2); min-height: 1.2em; }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div class="statusbar">
    <span id="clock">10:08</span>
    <svg viewBox="0 0 66 12" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/>
      <rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/>
      <path d="M31 2.2a9 9 0 0 1 7 3l-1.5 1.5a7 7 0 0 0-11 0L24 5.2a9 9 0 0 1 7-3zm0 4a5 5 0 0 1 4 2l-4 4-4-4a5 5 0 0 1 4-2z"/>
      <rect x="44" y="0.5" width="19" height="11" rx="3" fill="none" style="stroke: var(--chrome)" opacity=".5"/>
      <rect x="45.5" y="2" width="14" height="8" rx="1.8"/><rect x="64" y="4" width="1.6" height="4" rx=".8" opacity=".5"/>
    </svg>
  </div>

  <main id="screen">
    <header class="nav" id="nav">
      <h1 id="title">Kıvılcım</h1>
      <div class="compact" id="compact" aria-hidden="true"></div>
    </header>

    <section class="view" id="v-discover" aria-labelledby="title">
      <div class="scroller" id="disc">
        <div class="offline" id="offline" hidden><i class="ph ph-wifi-slash" aria-hidden="true"></i><p>Çevrimdışısın. Beğenilerin bağlantı gelince gönderilir.</p></div>
        <article id="profile"></article>
        <div id="st-loading" hidden aria-label="Profil yükleniyor" role="status">
          <div style="padding:4px 16px 16px"><div class="sk" style="width:62%;height:44px"></div><div class="sk" style="width:40%;height:16px;margin-top:10px"></div></div>
          <div class="sk" style="height:340px;border-radius:0"></div>
          <div style="padding:20px 16px"><div class="sk" style="width:50%;height:22px"></div><div style="display:flex;gap:8px;margin-top:12px"><div class="sk" style="width:96px;height:36px"></div><div class="sk" style="width:80px;height:36px"></div><div class="sk" style="width:64px;height:36px"></div></div></div>
        </div>
        <div class="state" id="st-error" hidden role="alert">
          <h2>Profiller yüklenemedi</h2>
          <p>Bağlantını kontrol edip tekrar dene.</p>
          <button class="btn btn-1" id="retry">Tekrar dene</button>
        </div>
        <div class="state" id="st-empty" hidden>
          <h2>Yakınındaki herkesi gördün</h2>
          <p>10 km içinde şu an yeni profil yok.</p>
          <button class="btn btn-1" id="replay" hidden></button>
        </div>
      </div>
      <div class="actionbar" id="actionbar">
        <div class="receipt" id="receipt" hidden>
          <p id="receipt-text"></p>
          <button class="link" id="undo">Geri al</button>
        </div>
        <div class="decide" id="decide">
          <button class="btn btn-2" id="pass"><i class="ph ph-x" aria-hidden="true"></i>Geç</button>
          <button class="btn btn-1" id="like"><i class="ph ph-heart" aria-hidden="true"></i>Beğen</button>
        </div>
      </div>
    </section>

    <section class="view" id="v-likes" hidden aria-labelledby="title"><div class="scroller" id="likes-scroll"></div></section>
    <section class="view" id="v-chats" hidden aria-labelledby="title"><div class="scroller" id="chats-scroll"></div></section>
    <section class="view" id="v-me" hidden aria-labelledby="title"><div class="scroller" id="me-scroll"></div></section>

    <nav class="tabbar" aria-label="Sekmeler">
      <button class="tab" data-tab="discover" data-icon="compass" aria-current="page"><i class="ph-fill ph-compass" aria-hidden="true"></i>Keşfet</button>
      <button class="tab" data-tab="likes" data-icon="heart"><i class="ph ph-heart" aria-hidden="true"></i>Beğeniler<span class="badge" id="badge"></span></button>
      <button class="tab" data-tab="chats" data-icon="chat-circle"><i class="ph ph-chat-circle" aria-hidden="true"></i>Sohbetler</button>
      <button class="tab" data-tab="me" data-icon="user"><i class="ph ph-user" aria-hidden="true"></i>Profil</button>
    </nav>
  </main>

  <div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Fotoğraflar">
    <div class="v-top">
      <button class="icon-btn" id="v-close" aria-label="Fotoğrafları kapat"><i class="ph ph-x" aria-hidden="true"></i></button>
      <p class="v-count" id="v-count" aria-live="polite"></p>
      <span></span>
    </div>
    <div class="v-track" id="v-track"></div>
    <div class="v-bot">
      <button class="icon-btn" id="v-prev" aria-label="Önceki fotoğraf"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
      <button class="icon-btn" id="v-next" aria-label="Sonraki fotoğraf"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
    </div>
  </div>

  <div id="scrim" hidden></div>
  <div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  <p class="sr" id="live" aria-live="polite"></p>

  <div class="home-indicator"></div>
  <script>document.getElementById('clock').textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });</script>
  <script>/* motion-kit.js (mobile-ui-craft 5.0). Zero dependencies. Inline it in one <script> of the prototype; it defines window.MK.
   Everything that should be filmable runs on WAAPI or view transitions, which scripts/capture.mjs `film:` slows down.
   requestAnimationFrame is used only for MK.tilt smoothing (pointer-driven, not filmed); never build a filmed move on it.
   Springs are CSS linear() easings generated at mass 1; the tokens are the Material 3 Expressive stiffness/damping pairs. */
(() => {
  const MK = (window.MK = { out: 'cubic-bezier(.2,.8,.2,1)' }); // out: for fades and menus, never for springs
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  MK.reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Spring as a linear() easing: stiffness k, damping ratio zeta (<= 1). ms is the time to settle within 0.2%.
  MK.spring = (k, zeta, pts = 36) => {

  function decide(kind, opts = {}) {
    const p = deck[pos]; if (!p || hashState() === 'loading' || hashState() === 'error') return;
    const offline = hashState() === 'offline';
    if (kind === 'block' || kind === 'report') { deck.splice(pos, 1); last = null; }
    else { last = { kind, p, at: pos }; if (kind === 'pass') passed.push(p); pos++; }
    const text = {
      like: offline ? `${p.dat} beğeni sırada` : opts.note ? `${p.dat} notunla beğeni gönderildi` : `${p.dat} beğeni gönderildi`,
      pass: `${p.acc} geçtin`, block: `${p.name} engellendi`, report: 'Şikâyetin alındı',
    }[kind];
    receipt(text, kind === 'like' || kind === 'pass');
    MK.haptic(kind === 'block' ? 'medium' : 'light');
    disc.scrollTop = 0; showDiscover(true);
    ($('#pname') || $('#st-empty h2')).focus?.({ preventScroll: true });
  }
  function undo() {
    if (!last) return;
    const { kind, p, at } = last;
    if (kind === 'pass') passed.pop();
    pos = at; last = null; receipt(null); live(`${p.name} geri geldi`);
    disc.scrollTop = 0; showDiscover(true); $('#pname')?.focus({ preventScroll: true });
  }

  /* sheet */
  const sheet = $('#sheet'), scrim = $('#scrim');
  let opener = null;
  function openSheet(body, from) {
    opener = from; sheet.innerHTML = `<div class="handle" aria-hidden="true"></div>${body}`;
    const wasOpen = !sheet.hidden;
    sheet.hidden = scrim.hidden = false; disc.style.overflowY = 'hidden';
    if (!wasOpen) {
      const e = MK.ease.spatial;
      sheet.animate(MK.reduced() ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateY(100%)' }, { transform: 'none' }], MK.reduced() ? { duration: 150 } : { duration: e.ms, easing: e.easing });
      scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: MK.out });
    }
    $('#sheet-title').focus({ preventScroll: true });
  }
  function closeSheet(keepFocus) {
    if (sheet.hidden) return;
    disc.style.overflowY = '';
    const a = sheet.animate(MK.reduced() ? [{ opacity: 1 }, { opacity: 0 }] : [{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: 200, easing: MK.out });
    scrim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: MK.out });
    a.finished.then(() => { sheet.hidden = scrim.hidden = true; sheet.innerHTML = ''; });
    if (!keepFocus && opener?.isConnected) opener.focus({ preventScroll: true });
  }
  const head = (title) => `<div class="sheet-head"><h2 id="sheet-title" tabindex="-1">${title}</h2><button class="plain-btn" data-close aria-label="Kapat"><i class="ph ph-x" aria-hidden="true"></i></button></div>`;

  function likeSheet(what, from) {
    const p = deck[pos], [type, i] = what.split(':');
    const item = type === 'prompt'
      ? `<div class="quote"><p class="q">${p.prompts[i].q}</p><p class="a">${p.prompts[i].a}</p></div>`
      : `<div class="quote photo"><div class="slot" style="--c:${p.photos[i].c}">${imgTag(p.photos[i])}</div></div>`;
    openSheet(head(`${p.dat} beğeni gönder`) + item
      + `<label class="field-label" for="note">Not ekle (isteğe bağlı)</label><textarea id="note" maxlength="150" rows="3" autocomplete="off" autocapitalize="sentences" enterkeyhint="send"></textarea>`
      + `<p class="count" id="note-count">0/150</p><button class="btn btn-1 btn-full" id="send-like"><i class="ph ph-heart" aria-hidden="true"></i>Beğeni gönder</button>`, from);
  }
  function reportSheet(from) {
    const p = deck[pos];
    openSheet(head(`${p.acc} şikâyet et veya engelle`)
      + `<button class="opt" id="go-block"><i class="ph ph-prohibit" aria-hidden="true"></i><div><b>Engelle</b><span>Birbirinizi artık görmezsiniz.</span></div></button>`
      + `<button class="opt" id="go-report"><i class="ph ph-flag" aria-hidden="true"></i><div><b>Şikâyet et</b><span>Kıvılcım ekibi inceler, ${p.name} kimin bildirdiğini görmez.</span></div></button>`, from);
  }
  function blockStep() {
    const p = deck[pos];
    openSheet(head(`${p.acc} engelle`) + `<p class="sheet-p">Birbirinizi artık görmezsiniz. Engeli Ayarlar’dan kaldırabilirsin.</p>`
      + `<button class="btn btn-danger btn-full" id="do-block">${p.acc} engelle</button><button class="btn btn-2 btn-full" data-close>Vazgeç</button>`, opener);
  }
  function reasonStep() {
    const p = deck[pos], reasons = ['Sahte profil', 'Uygunsuz fotoğraf', 'Taciz veya tehdit', '18 yaşından küçük olabilir', 'Başka bir sebep'];
    openSheet(head(`${p.acc} şikâyet et`) + `<fieldset style="border:0;margin:0;padding:0"><legend class="sr">Şikâyet sebebi</legend>`
      + reasons.map((r, k) => `<label class="reason"><input type="radio" name="reason" value="${k}">${r}</label>`).join('') + `</fieldset>`
      + `<p class="err" id="reason-err" aria-live="assertive"></p><button class="btn btn-1 btn-full" id="do-report">Şikâyeti gönder</button>`, opener);
  }

  /* photo viewer: the tapped photo is the thing that grows */
  const viewer = $('#viewer'), track = $('#v-track');
  let vIdx = 0, vOpener = null;
  const setCount = (i) => { vIdx = i; const n = track.children.length; $('#v-count').textContent = `${i + 1} / ${n}`; $('#v-prev').disabled = i === 0; $('#v-next').disabled = i === n - 1; };
  function openViewer(i, btn) {
    const p = deck[pos], src = btn.querySelector('img'); vOpener = btn;
    track.innerHTML = p.photos.map((ph) => `<div class="v-slide"><div class="slot" style="--c:${ph.c}"><img class="in" src="${IMG(ph)}" alt="${ph.alt}" crossorigin="anonymous" onerror="this.remove()"></div></div>`).join('');
    const dst = track.children[i].querySelector('img');
    if (src) src.style.viewTransitionName = 'photo';
    MK.morph(() => {
      if (src) src.style.viewTransitionName = '';
      dst.style.viewTransitionName = 'photo';
      viewer.hidden = false; html.dataset.viewer = ''; track.scrollLeft = i * track.clientWidth; setCount(i);
    }).then(() => { dst.style.viewTransitionName = ''; $('#v-close').focus({ preventScroll: true }); });
  }
  function closeViewer() {
    if (viewer.hidden) return;
    const from = track.children[vIdx]?.querySelector('img'), to = $(`.photo-open[data-idx="${vIdx}"] img`, art);
    const r = to?.getBoundingClientRect(), dr = disc.getBoundingClientRect();
    const fly = to && from && r.bottom > dr.top && r.top < dr.bottom; // fly home only to a photo that is on screen
    if (fly) from.style.viewTransitionName = 'photo';
    MK.morph(() => {
      if (fly) { from.style.viewTransitionName = ''; to.style.viewTransitionName = 'photo'; }
      viewer.hidden = true; delete html.dataset.viewer;
    }).then(() => { if (fly) to.style.viewTransitionName = ''; vOpener?.focus({ preventScroll: true }); });
  }
  const page = (d) => { const i = Math.max(0, Math.min(track.children.length - 1, vIdx + d)); track.scrollTo({ left: i * track.clientWidth, behavior: MK.reduced() ? 'auto' : 'smooth' }); setCount(i); };
  track.addEventListener('scroll', () => { const i = Math.round(track.scrollLeft / track.clientWidth); if (i !== vIdx) setCount(i); }, { passive: true });
  $('#v-close').onclick = closeViewer; $('#v-prev').onclick = () => page(-1); $('#v-next').onclick = () => page(1);

  /* other tabs */
  const avatar = (ph, cls = 'avatar') => `<div class="slot ${cls}" style="--c:${ph.c}"><img src="${IMG(ph, 200, 200)}" alt="" crossorigin="anonymous" onload="this.classList.add('in')" onerror="this.remove()"></div>`;
  function renderLikes() {
    const rows = LIKERS.map((l, k) => {
      const top = `<p class="pname">${l.name}, ${l.age}</p>`;
      if (l.state === 'match') return `<div class="person">${avatar(l.photo)}<div>${top}<div class="pact"><p>${l.name} ile eşleştiniz</p><button class="btn btn-2 btn-sm" style="flex:none" data-go-chats>Sohbetlere git</button></div></div></div>`;
      if (l.state === 'pass') return `<div class="person">${avatar(l.photo)}<div>${top}<div class="pact"><p>${l.acc} geçtin</p><button class="link" data-liker="${k}" data-set="new">Geri al</button></div></div></div>`;
      return `<div class="person">${avatar(l.photo)}<div>${top}<p class="psub">${l.what}</p>${l.note ? `<p class="note">${l.note}</p>` : ''}`
        + `<div class="pact"><button class="btn btn-2 btn-sm" data-liker="${k}" data-set="pass"><i class="ph ph-x" aria-hidden="true"></i>Geç</button><button class="btn btn-1 btn-sm" data-liker="${k}" data-set="match"><i class="ph ph-heart" aria-hidden="true"></i>Eşleş</button></div></div></div>`;
    }).join('');
    $('#likes-scroll').innerHTML = `<h2 class="sect">Seni beğenenler</h2>${rows}<div class="end-pad"></div>`;
    const n = LIKERS.filter((l) => l.state === 'new').length, b = $('#badge');
    b.textContent = n; b.hidden = !n; b.setAttribute('aria-hidden', 'true');
    b.parentElement.setAttribute('aria-label', n ? `Beğeniler, ${n} yeni` : 'Beğeniler');
    console.assert($('#likes-scroll').querySelectorAll('[data-set="match"]').length === n, 'badge must match the open likes');
  }
  function renderChats() {
    const matched = LIKERS.filter((l) => l.state === 'match').map((l) => ({ name: l.name, photo: l.photo, last: 'Yeni eşleşme, henüz mesaj yok', time: 'Şimdi' }));
    $('#chats-scroll').innerHTML = [...matched, ...CHATS].map((c) => `<div class="person">${avatar(c.photo)}<div><div style="display:flex;justify-content:space-between;gap:12px"><p class="pname">${c.name}</p><span class="chat-time">${c.time}</span></div><p class="psub">${c.last}</p></div></div>`).join('') + '<div class="end-pad"></div>';
  }
  function renderMe() {
    $('#me-scroll').innerHTML = `<div class="me-head">${avatar(ME.photo, 'me-photo')}<p class="pname" style="font:var(--t-title)">${ME.name}, ${ME.age}</p></div>`
      + `<h2 class="sect">İlgi alanların</h2><ul class="chips pad">${ME.interests.map((i) => `<li class="chip mine">${i}</li>`).join('')}</ul>`
      + `<h2 class="sect">Yanıtların</h2>${ME.prompts.map((q) => `<section class="prompt" style="margin-top:0;margin-bottom:12px"><p class="q">${q.q}</p><p class="a">${q.a}</p></section>`).join('')}<div class="end-pad"></div>`;
  }
  const scrollMemo = {};
  function setTab(t) {
    const cur = $(`#v-${tab} .scroller`); scrollMemo[tab] = cur.scrollTop;
    tab = t;
    document.querySelectorAll('.tab').forEach((b) => { const on = b.dataset.tab === t; b.toggleAttribute('aria-current', on); if (on) b.setAttribute('aria-current', 'page');
      b.querySelector('i').className = `${on ? 'ph-fill' : 'ph'} ph-${b.dataset.icon}`; });
    ['discover', 'likes', 'chats', 'me'].forEach((v) => { $(`#v-${v}`).hidden = v !== t; });
    $('#title').textContent = { discover: 'Kıvılcım', likes: 'Beğeniler', chats: 'Sohbetler', me: 'Profil' }[t];
    $('#compact').hidden = t !== 'discover';
    if (t === 'likes') renderLikes(); if (t === 'chats') renderChats(); if (t === 'me') renderMe();
    $(`#v-${t} .scroller`).scrollTop = scrollMemo[t] || 0;
    nav.classList.toggle('scrolled', (scrollMemo[t] || 0) > 72);
  }

  /* wiring */
  art.addEventListener('click', (e) => {
    const like = e.target.closest('[data-like]'), open = e.target.closest('.photo-open'), rep = e.target.closest('#report-open');
    if (like) likeSheet(like.dataset.like, like);
    else if (open) openViewer(+open.dataset.idx, open);
    else if (rep) reportSheet(rep);
  });
  sheet.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('[data-close]')) return closeSheet();
    if (t.closest('#send-like')) { const note = $('#note').value.trim(); closeSheet(true); return decide('like', { note }); }
    if (t.closest('#go-block')) return blockStep();
    if (t.closest('#go-report')) return reasonStep();
    if (t.closest('#do-block')) { closeSheet(true); return decide('block'); }
    if (t.closest('#do-report')) {
      if (!sheet.querySelector('input[name=reason]:checked')) { $('#reason-err').textContent = 'Bir sebep seç.'; return; }
      closeSheet(true); return decide('report');
    }
  });
  sheet.addEventListener('input', (e) => { if (e.target.id === 'note') $('#note-count').textContent = `${e.target.value.length}/150`; });
  sheet.addEventListener('change', () => { const er = $('#reason-err'); if (er) er.textContent = ''; });
  scrim.onclick = () => closeSheet();
  $('#like').onclick = () => decide('like');
  $('#pass').onclick = () => decide('pass');
  $('#undo').onclick = undo;
  $('#retry').onclick = () => { history.replaceState(null, '', location.pathname + location.search); showDiscover(true); };
  $('#replay').onclick = () => { deck.push(...passed); passed = []; last = null; receipt(null); showDiscover(true); $('#pname')?.focus({ preventScroll: true }); };
  document.querySelectorAll('.tab').forEach((b) => { b.onclick = () => setTab(b.dataset.tab); });
  $('#v-likes').addEventListener('click', (e) => {
    const b = e.target.closest('[data-liker]'); if (b) { const l = LIKERS[+b.dataset.liker]; l.state = b.dataset.set; renderLikes(); live(l.state === 'match' ? `${l.name} ile eşleştiniz` : l.state === 'pass' ? `${l.acc} geçtin` : `${l.name} geri geldi`); if (l.state === 'match') MK.haptic('success'); }
    if (e.target.closest('[data-go-chats]')) setTab('chats');
  });
  disc.addEventListener('scroll', () => { nav.classList.toggle('scrolled', disc.scrollTop > 72 && !art.hidden); }, { passive: true });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (!sheet.hidden) closeSheet(); else if (!viewer.hidden) closeViewer(); }
    if (!viewer.hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) page(e.key === 'ArrowRight' ? 1 : -1);
  });
  addEventListener('hashchange', () => showDiscover(false));
  showDiscover(false); renderLikes();
  </script>
</body>
</html>
