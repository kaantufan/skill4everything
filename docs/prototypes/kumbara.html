<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumbara prototipi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #1f3fe0; --cobalt-deep: #0a1a86; --ink: #081057;
    --turq: #2fe0cf; --turq-deep: #0c9fb3; --coral: #ff5a3c; --sun: #ffc93c; --glaze: #fbf6ea;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --text: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 393px; height: 852px; overflow: hidden; }
  body {
    position: relative; font-family: var(--text); color: #fff; user-select: none;
    background: radial-gradient(130% 70% at 18% -6%, #4a6bff 0%, var(--cobalt) 36%, var(--cobalt-deep) 100%);
  }
  /* glaze: tile motif that fades out, plus fine grain */
  .motif { position: absolute; inset: 0; opacity: .5; -webkit-mask-image: linear-gradient(#000 0%, transparent 62%); mask-image: linear-gradient(#000 0%, transparent 62%); }
  .grain { position: absolute; inset: 0; opacity: .16; mix-blend-mode: soft-light; pointer-events: none; }

  .status { position: absolute; inset: 0 0 auto 0; height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 9px; font: 600 16px var(--text); }
  .status svg { height: 12px; fill: #fff; }

  header { position: absolute; top: 64px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; }
  .word { font: 800 25px/1 var(--display); letter-spacing: -.6px; font-variation-settings: "wdth" 84; }
  .word i { display: inline-block; width: 9px; height: 9px; margin-left: 3px; border-radius: 50%; background: var(--coral); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
  .month { all: unset; cursor: pointer; display: flex; align-items: center; gap: 7px; padding: 9px 14px 9px 16px; border-radius: 999px; font: 600 15px var(--text);
    background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.12); backdrop-filter: blur(8px); }
  .month svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* hero */
  .hero { position: absolute; top: 108px; left: 0; width: 393px; height: 400px; }
  .jarwrap { position: absolute; left: 46px; top: 6px; width: 300px; height: 330px; animation: float 6s ease-in-out infinite; }
  .jar { width: 300px; height: 330px; overflow: visible; display: block; transform-origin: 50% 100%; }
  .shadow { position: absolute; left: 86px; top: 322px; width: 220px; height: 26px; border-radius: 50%; background: #040b54; filter: blur(12px); opacity: .55; animation: shadow 6s ease-in-out infinite; }
  .glow { position: absolute; left: 76px; top: 250px; width: 240px; height: 90px; border-radius: 50%; background: var(--turq); filter: blur(46px); opacity: .5; }
  @keyframes float { 50% { transform: translateY(-7px); } }
  @keyframes shadow { 50% { transform: scale(.92); opacity: .42; } }

  .lvl { transform: translateY(var(--lvl, 134px)); transition: transform .9s cubic-bezier(.3, 1.5, .5, 1); }
  .rise { animation: rise 1.9s cubic-bezier(.22, .9, .24, 1) .25s both; }
  @keyframes rise { 0% { transform: translateY(250px); } 72% { transform: translateY(-9px); } 100% { transform: none; } }
  .w1 { animation: wave 4.6s linear infinite; }
  .w2 { animation: wave 7s linear infinite reverse; }
  @keyframes wave { to { transform: translateX(-150px); } }
  .bub { animation: bub 3.6s ease-in infinite; opacity: 0; }
  .bub:nth-of-type(2) { animation-delay: 1.3s; } .bub:nth-of-type(3) { animation-delay: 2.4s; }
  @keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-86px); opacity: 0; } }
  .sheen { animation: sheen 5.5s ease-in-out 1.4s infinite; opacity: 0; }
  @keyframes sheen { 0% { transform: translateX(-190px) skewX(-18deg); opacity: 0; } 12% { opacity: .55; } 30%, 100% { transform: translateX(250px) skewX(-18deg); opacity: 0; } }

  .num { font: 800 70px/1 var(--display); letter-spacing: -3px; font-variation-settings: "wdth" 80; font-variant-numeric: tabular-nums; text-anchor: middle; }
  .dec { font: 700 27px var(--display); letter-spacing: 0; }
  .cap { font: 600 14px var(--text); letter-spacing: .1px; text-anchor: middle; }
  .numwrap { animation: pop .7s cubic-bezier(.2, 1.3, .4, 1) .55s both; transform-origin: 150px 200px; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.94); } }
  .tick { animation: tick .42s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 150px 210px; }
  @keyframes tick { 30% { transform: scale(.93) translateY(3px); } }

  .coin { position: absolute; left: 179px; top: 96px; width: 36px; height: 36px; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at 34% 28%, #fff3bf 0 12%, var(--sun) 40%, #e69a0e 100%);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18), 0 8px 14px rgba(4,11,84,.45);
    display: grid; place-items: center; font: 800 17px var(--display); color: #a86400; }

  .pill { position: absolute; left: 50%; top: 352px; transform: translateX(-50%); white-space: nowrap; display: flex; align-items: center; gap: 9px; padding: 10px 16px 10px 12px; border-radius: 999px; font: 500 14.5px var(--text);
    background: rgba(8,16,87,.36); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.1); backdrop-filter: blur(10px); animation: fade .6s ease-out 1.1s both; }
  .pill b { font: 700 15.5px var(--display); letter-spacing: -.2px; font-variant-numeric: tabular-nums; }
  .pill .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  .pill .dot svg { width: 12px; height: 12px; stroke: #7a4a00; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  @keyframes fade { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }

  /* sheet */
  .sheet { position: absolute; left: 0; right: 0; top: 524px; bottom: 0; padding: 22px 22px 0; color: var(--ink); border-radius: 36px 36px 0 0;
    background: linear-gradient(#fffdf6, var(--glaze) 30%); box-shadow: 0 -18px 40px rgba(4,11,84,.38), inset 0 1.5px 0 #fff; animation: sheet .9s cubic-bezier(.2, 1.15, .3, 1) .35s both; }
  @keyframes sheet { from { transform: translateY(170px); } }
  .sheet::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 168px; background: linear-gradient(rgba(251,246,234,0), var(--glaze) 46%); pointer-events: none; }
  .sheet h2 { margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; font: 800 23px/1.1 var(--display); letter-spacing: -.6px; font-variation-settings: "wdth" 86; }
  .sheet h2 a { font: 600 14.5px var(--text); letter-spacing: 0; color: var(--cobalt); }
  .row { display: flex; align-items: center; gap: 13px; height: 62px; animation: rowin .55s cubic-bezier(.2, 1.2, .4, 1) both; }
  .row:nth-child(1) { animation-delay: .75s; } .row:nth-child(2) { animation-delay: .86s; } .row:nth-child(3) { animation-delay: .97s; }
  .row + .row { box-shadow: 0 -1px 0 rgba(8,16,87,.09); }
  @keyframes rowin { from { opacity: 0; transform: translateY(18px); } }
  .row.new { animation: none; }
  .tile { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; box-shadow: inset 0 1.5px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(8,16,87,.14), 0 3px 8px rgba(8,16,87,.13); }
  .tile svg { width: 22px; height: 22px; stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .t-turq { background: var(--turq); } .t-sun { background: var(--sun); } .t-coral { background: #ff8d73; } .t-blue { background: #9fb3ff; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font: 600 16.5px/1.2 var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font: 500 13px var(--text); color: rgba(8,16,87,.58); }
  .amt { font: 700 17.5px var(--display); letter-spacing: -.3px; font-variant-numeric: tabular-nums; }

  /* dock */
  .dock { position: absolute; left: 16px; right: 16px; bottom: 26px; height: 66px; border-radius: 33px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
    background: linear-gradient(#1529ad, var(--ink)); box-shadow: 0 16px 30px rgba(8,16,87,.45), inset 0 1px 0 rgba(255,255,255,.28); animation: sheet .8s cubic-bezier(.2, 1.2, .3, 1) .6s both; }
  .dock button { all: unset; cursor: pointer; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; position: relative; }
  .dock svg { width: 24px; height: 24px; stroke: rgba(255,255,255,.62); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dock .on svg { stroke: #fff; }
  .dock .on::after { content: ""; position: absolute; bottom: 1px; width: 5px; height: 5px; border-radius: 50%; background: var(--turq); box-shadow: 0 0 8px var(--turq); }
  .dock .gap { width: 62px; }
  .add { all: unset; cursor: pointer; position: absolute; left: 50%; bottom: 36px; width: 72px; height: 72px; margin-left: -36px; border-radius: 50%; display: grid; place-items: center; z-index: 3;
    background: radial-gradient(circle at 32% 24%, #ffb39f 0 10%, var(--coral) 46%, #d93a1e 100%);
    box-shadow: 0 0 0 6px var(--glaze), 0 14px 22px rgba(217,58,30,.45), inset 0 -5px 0 rgba(0,0,0,.16), inset 0 2px 0 rgba(255,255,255,.5);
    transition: transform .14s cubic-bezier(.3, 1.6, .5, 1); animation: addin .7s cubic-bezier(.2, 1.5, .4, 1) .95s both; }
  .add:active { transform: scale(.92) translateY(2px); }
  .add svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; }
  @keyframes addin { from { transform: scale(0) rotate(-90deg); } }
  .home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); opacity: .85; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <svg class="motif" viewBox="0 0 393 852" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <pattern id="cini" width="56" height="56" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.4">
          <path d="M28 6c7 8 7 14 0 22c-7-8-7-14 0-22zM28 28c7 8 7 14 0 22c-7-8-7-14 0-22zM6 28c8-7 14-7 22 0c-8 7-14 7-22 0zM28 28c8-7 14-7 22 0c-8 7-14 7-22 0z"/>
          <circle cx="0" cy="0" r="5"/><circle cx="56" cy="0" r="5"/><circle cx="0" cy="56" r="5"/><circle cx="56" cy="56" r="5"/>

  </svg>
  <svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <div class="status"><span>9:41</span>
    <svg viewBox="0 0 66 12" aria-hidden="true"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" width="3" height="12" rx="1"/><path d="M31 2.2a9 9 0 0 1 7 3l-1.5 1.5a7 7 0 0 0-11 0L24 5.2a9 9 0 0 1 7-3zm0 4a5 5 0 0 1 4 2l-4 4-4-4a5 5 0 0 1 4-2z"/><rect x="45.5" y="2" width="14" height="8" rx="1.8"/><rect x="44" y=".5" width="19" height="11" rx="3" fill="none" stroke="#fff" opacity=".5"/></svg>

  <header>

          <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ff2e2"/><stop offset=".5" stop-color="#22cfc4"/><stop offset="1" stop-color="#0c9fb3"/></linearGradient>

              <path class="w2" fill-opacity=".5" d="M-300 4q37.5-13 75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0V280H-300Z"/>
              <path class="w1" d="M-300 0q37.5 11 75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0V280H-300Z"/>
              <path class="w1" fill="none" stroke="#eafffb" stroke-opacity=".7" stroke-width="2.5" d="M-300 0q37.5 11 75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0"/>

          <g fill="#fff"><circle class="bub" cx="92" cy="286" r="4"/><circle class="bub" cx="206" cy="292" r="3"/><circle class="bub" cx="150" cy="296" r="2.5"/></g>
          <rect class="sheen" x="0" y="60" width="46" height="260" fill="#fff"/>

        <use href="#body" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.5"/>

        <path d="M238 92c12 12 20 26 25 42" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>

        <rect x="92" y="16" width="116" height="40" rx="15" fill="none" stroke="#0a1a86" stroke-opacity=".12"/>
        <path d="M100 46h100" stroke="#1f3fe0" stroke-width="3" stroke-linecap="round"/><path d="M100 46h100" stroke="#2fe0cf" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
        <rect x="122" y="27" width="56" height="10" rx="5" fill="#081057"/>

        <g class="numwrap"><g id="numg">
          <text class="cap" x="150" y="150" fill="#fff" fill-opacity=".86">Bu ay kalan</text>

          <text class="num" x="150" y="226" fill="#081057" mask="url(#inLiquid)"><tspan class="dec" dy="-17">₺</tspan><tspan dy="17" dx="6" id="n2">8.262</tspan></text>

    </div>
    <div class="pill"><span class="dot"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="2.2"/><path d="M6 .8v1.4M6 9.8v1.4M.8 6h1.4M9.8 6h1.4"/></svg></span><span>Bugün <b id="daily">₺688</b> harcayabilirsin</span></div>
  </section>

  <section class="sheet">
    <h2>Son harcamalar <a>Tümü</a></h2>

      <div class="row"><span class="tile t-turq"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1.6 9.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8zM8.5 8V7a3.5 3.5 0 0 1 7 0v1"/></svg></span><span class="who"><b>Migros</b><span>Market · 13:42</span></span><span class="amt">−₺642,80</span></div>
      <div class="row"><span class="tile t-sun"><svg viewBox="0 0 24 24"><rect x="6" y="3.5" width="12" height="14" rx="3"/><path d="M6 11h12M9 20.5l1.5-3M15 20.5l-1.5-3M9.5 14.5h.01M14.5 14.5h.01"/></svg></span><span class="who"><b>İstanbulkart yükleme</b><span>Ulaşım · 08:15</span></span><span class="amt">−₺200,00</span></div>
      <div class="row"><span class="tile t-blue"><svg viewBox="0 0 24 24"><path d="M13 3 5.5 13.5H11L10 21l8-11h-6z"/></svg></span><span class="who"><b>Enerjisa Elektrik</b><span>Fatura · Dün</span></span><span class="amt">−₺1.184,25</span></div>

  <nav class="dock" aria-label="Ana gezinme">

    <button aria-label="Harcamalar"><svg viewBox="0 0 24 24"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg></button>

  <div class="home"></div>

<script>
  // Prototype state: sample numbers, not real data.
  const BUDGET = 18500, BODY = 242, DAYS = 12;
  let remaining = 8262.35;
  const tr = (n, d = 0) => n.toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const setLevel = () => root.style.setProperty('--lvl', (BODY * (1 - remaining / BUDGET)).toFixed(1) + 'px');
  setLevel();

  const SPENDS = [
    ['Kahve Dünyası', 'Kafe', 128.5, 't-coral', '<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10.5h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2M12 3.5v2"/>'],
    ['Trendyol', 'Alışveriş', 349.9, 't-turq', '<path d="M5 8h14l-1 11H6zM9 8a3 3 0 0 1 6 0"/>'],
    ['BiTaksi', 'Ulaşım', 215, 't-sun', '<path d="M5 16v-3l1.5-4.5h11L19 13v3M5 16h14M7.5 16v2M16.5 16v2M8 13h.01M16 13h.01"/>'],
  ];
  let i = 0, busy = false;

  function spend() {
    if (busy) return;
    busy = true;
    const [name, cat, amount, tile, icon] = SPENDS[i++ % SPENDS.length];
    const coin = $('coin');
    // the coin falls into the slot, then the level drops and the number ticks
    coin.animate([
      { opacity: 0, transform: 'translateY(-70px) rotateY(0) scale(.7)' },
      { opacity: 1, transform: 'translateY(-34px) rotateY(180deg) scale(1)', offset: .35 },
      { opacity: 1, transform: 'translateY(22px) rotateY(540deg) scale(1)', offset: .8 },
      { opacity: 0, transform: 'translateY(40px) rotateY(600deg) scaleX(.5) scaleY(.2)' },
    ], { duration: 720, easing: 'cubic-bezier(.5,0,.9,.6)' }).onfinish = () => {
      remaining = Math.max(0, remaining - amount);
      setLevel();
      $('n1').textContent = $('n2').textContent = tr(Math.floor(remaining));
      $('daily').textContent = '₺' + tr(Math.floor(remaining / DAYS));
      const g = $('numg');
      g.classList.remove('tick'); void g.getBBox(); g.classList.add('tick');
      const row = document.createElement('div');
      row.className = 'row new';
      row.innerHTML = `<span class="tile ${tile}"><svg viewBox="0 0 24 24">${icon}</svg></span><span class="who"><b>${name}</b><span>${cat} · Şimdi</span></span><span class="amt">−₺${tr(amount, 2)}</span>`;
      const list = $('list');
      list.prepend(row);
      row.animate([{ transform: "translateY(-20px)" }, { transform: "none" }], { duration: 520, easing: "cubic-bezier(.2,1.3,.4,1)" });
      document.querySelector(".jarwrap svg").animate([{ transform: "none" }, { transform: "scale(1.035,.965)", offset: .35 }, { transform: "scale(.985,1.015)", offset: .7 }, { transform: "none" }], { duration: 520, easing: "ease-out" });
      if (list.children.length > 3) list.lastElementChild.remove();
      setTimeout(() => { busy = false; }, 500);
    };
  }
  $('add').addEventListener('click', spend);
  // one demo spend so the screen explains itself; skipped when the viewer prefers reduced motion
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(spend, 3200);
</script>
</body>
